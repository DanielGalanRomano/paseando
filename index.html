<script>

 const uid=S.uid,now=new Date().toISOString();

 if(!plan||!S.plan||plan.id!==S.plan.id)S.fin=false;
 S.t0=Date.now();S.p=p;S.ca=ca||[];S.dias=dias||[];S.sqlOk=dias!==null;S.plan=plan;S.w=wf[0]||null;S.ocu=0;S.yo=false;S.nu=nu;S.rk=rk;

  const j=document.createElement('script');j.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';j.onload=ok;j.onerror=()=>{LP=null;no(new Error('mapa'))};document.head.appendChild(j)});return LP}

function shrink(f,max=900){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',.85)};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('imagen no válida'))};im.src=u})}

function mbtn(){const b=$('#menuBtn'),u=S.p&&S.p.foto_url;b.innerHTML=u?`<img src="${esc(u)}" referrerpolicy="no-referrer" alt="Mi cuenta" style="width:38px;height:38px;border-radius:19px;object-fit:cover;border:2px solid #fff">`:HAM}
function render(name,still){view=name;mbtn();const el=$('#screen'),st=el.scrollTop;S.anim=!still;S.rt=performance.now();el.classList.toggle('still',!!still);el.innerHTML=V[name]();enhance(el);
 el.scrollTop=still?st:0;$('#menuBtn').style.display=['login','consent'].includes(name)?'none':'flex';$('#fab').style.display=name==='home'?'flex':'none';
 if(!still)el.animate([{transform:'translateX(24px)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})}
/* Refresca números sin volver a dibujar toda la pantalla */
function softRefresh(){const h=$('#heroIn');if(h)h.innerHTML=heroInner();drawChart(false);drawRank();drawHoy()}
/* Cada segundo: si hay una caminata en marcha, el número de pasos sube solo */
function tick(){const pl=S.plan;if(view!=='home'||!pl||pl.estado!=='aceptada'||S.fin||performance.now()-S.rt<1400)return;
 const m=pl.pasos_meta||PASITO,v=Math.min(m,pl.pasos+liveD()),hh=$('#heroIn');if(hh)hh.innerHTML=heroInner();
 const pb=$('#hoyPb'),pt=$('#hoyPt');if(pb)pb.style.width=(v/m*100)+'%';if(pt)pt.textContent=fmt(v)+' de '+fmt(m)+' pasos';
 if(v>=m){S.fin=true;drawHoy();drawChart(false)}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
const need=fn=>{if(!perfilOk()){S.after=fn;perfilSheet();return}fn()};
const ERR={perfil_incompleto:'Completá tu foto de cuerpo entero y tu edad',fuera_de_horario:'Las caminatas son entre las 18 y las 22 h',ya_tenes_caminata:'Ya tenés una caminata activa',completa:'La caminata ya está completa',no_disponible:'Esa caminata ya no está disponible',fecha_invalida:'Elegí un horario válido',limite_diario:'Llegaste al máximo de 10 horas por día',sin_plan:'No encontramos tu caminata de hoy',ruta_invalida:'No pudimos guardar el trayecto'};

/* ============ EVENTOS ============ */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='terms')e.preventDefault();
 try{
 if(a==='menu')menuSheet();
 if(a==='close')closeSheet();
 if(a==='terms'){closeSheet();S.prev=view;render('terms')}
 if(a==='back')render(S.prev&&S.prev!=='terms'?S.prev:'home');
 if(a==='open')openDetail(id);
 if(a==='login'){try{localStorage.setItem('consent','1')}catch(x){}await q(sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}))}
 if(a==='accept'){const ts=new Date().toISOString();await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:ts}).eq('id',S.uid));S.p.acepto_terminos_at=ts;await load();render('home');startHoy()}
 if(a==='logout'){await sb.auth.signOut();S={min:[],ca:[],dias:[]};closeSheet();render('login')}
 if(a==='perfil')perfilSheet();
 if(a==='savepf'){const ed=+$('#pe').value;if(!(ed>=18&&ed<=99)){toast('Tenés que tener 18 años o más');return}
  if(!S.p.foto_cuerpo_url){toast('Subí tu foto de cuerpo entero');return}
  t.disabled=true;await q(sb.from('profiles').update({edad:ed}).eq('id',S.uid));S.p.edad=ed;closeSheet();toast('Perfil listo');const f=S.after;S.after=null;if(f)f()}
 if(a==='newc')newSheet();
 if(a==='sop')sopSheet();
 if(a==='qday'){S.qd=t.dataset.v;S.qt='';qTimes()}
 if(a==='qtime'){S.qt=t.dataset.v;document.querySelectorAll('#qt .tm').forEach(b=>b.classList.toggle('on',b.dataset.v===S.qt))}
 if(a==='qpp'){S.qp=+t.dataset.v;document.querySelectorAll('#qp .tm').forEach(b=>b.classList.toggle('on',b===t))}
 if(a==='qmyloc'){if(!navigator.geolocation||!PQM){toast('No pudimos obtener tu ubicación');return}
  navigator.geolocation.getCurrentPosition(p=>{PQM.m.setView([p.coords.latitude,p.coords.longitude],17);PQM.put(p.coords.latitude,p.coords.longitude)},()=>toast('No pudimos obtener tu ubicación'),{enableHighAccuracy:true,timeout:10000})}
 if(a==='pubc'){if(!PQ){toast('Marcá el pin en el mapa');return}if(!S.qt){toast('Elegí un horario');return}
  if(!S.p.foto_cuerpo_url){toast('Subí tu foto de cuerpo entero');return}
  let ed=S.p.edad;if(!(ed>=18)){ed=+($('#pe')&&$('#pe').value);if(!(ed>=18&&ed<=99)){toast('Tenés que tener 18 años o más');return}}
  t.disabled=true;if(ed!==S.p.edad){await q(sb.from('profiles').update({edad:ed}).eq('id',S.uid));S.p.edad=ed}
  await q(sb.rpc('crear_caminata',{p_lat:PQ.lat,p_lng:PQ.lng,p_punto:S.qpunto||'Punto marcado en el mapa',p_inicia:new Date(`${S.qd}T${S.qt}:00-03:00`).toISOString(),p_cupo:S.qp}));
  await load();closeSheet();render('home',true);toast('¡Caminata publicada!')}
 if(a==='join')need(async()=>{await q(sb.rpc('sumarme_caminata',{p_id:id}));await load();render('home',true);openDetail(id);toast('¡Te sumaste!')});
 if(a==='leave'){const c=S.ca.find(x=>x.id===id);if(c&&c.es_mio&&!confirm('Si cancelás tu caminata, se cancela para todos. ¿Seguro?'))return;
  t.disabled=true;const r=await q(sb.rpc('bajarme_caminata',{p_id:id}));await load();render('home',true);if(r==='cancelada'){closeSheet();toast('Caminata cancelada')}else{openDetail(id);toast('Te bajaste de la caminata')}}
 if(a==='wjoin'){t.disabled=true;const r=await q(sb.rpc('join_walk',{p_walk:S.w.id}));await load();render('home',true);toast(r==='completa'?'Se completó el cupo':'¡Te anotaste a la caminata grupal!')}
 if(a==='wleave'){t.disabled=true;await q(sb.rpc('salir_walk',{p_walk:S.w.id}));await load();render('home',true);toast('Te bajaste de la caminata grupal')}
 /* --- caminata sugerida del día --- */
 if(a==='plan-open')openPlan();
 if(a==='plan-retry'){S.pos=null;await buildPlan()}
 if(a==='plan-yes'||a==='plan-no'){t.disabled=true;await q(sb.rpc('responder_caminata_dia',{p_acepta:a==='plan-yes'}));await load();closeSheet();render('home',true);toast(a==='plan-yes'?'¡A caminar! Tus pasos se suman solos':'Listo, mañana te proponemos otra')}
 /* --- gráfico y ranking --- */
 if(a==='cper'){S.cp=t.dataset.v;document.querySelectorAll('#cper .tm').forEach(b=>b.classList.toggle('on',b===t));drawChart(true)}
 if(a==='rkp'){S.rkp=t.dataset.v;document.querySelectorAll('#rper .tm').forEach(b=>b.classList.toggle('on',b===t));const r=await rankQ(S.rkp);if(r!==null)S.rk=r;drawRank()}
 }catch(err){const m=err&&err.message||'';const k=Object.keys(ERR).find(x=>m.includes(x));toast(k?ERR[k]:m||'Ocurrió un error');t.disabled=false}
});
document.addEventListener('input',e=>{if(e.target.id==='ok18')$('#go').disabled=!e.target.checked});
document.addEventListener('change',e=>{if(e.target.id==='pf'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)subirCuerpo(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ============ INICIO ============ */
async function boot(){
 if(!sb){$('#screen').innerHTML='<div class="card" style="margin-top:40px"><h2>Falta configurar Supabase</h2></div>';return}
 const{data:{session}}=await sb.auth.getSession();
 if(!session){render('login');return}
 S.uid=session.user.id;S.meta=session.user.user_metadata||{};S.ids=session.user.identities||[];
 await registrarEntrada();
 try{await load();const ok=!!S.p.acepto_terminos_at;render(ok?'home':'consent');if(ok)startHoy()}catch(e){toast(e.message||'No se pudo cargar');render('login')}}
/* Actualiza caminatas, pasos y ranking cada 15 s (si no hay ventana abierta) */
setInterval(async()=>{if(document.hidden||!S.uid||view!=='home'||S.building||$('#sheet').classList.contains('on'))return;
 const b=sig();try{await load();if(sig()!==b)render('home',true);else softRefresh()}catch(e){}},15000);
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.uid&&view==='home'&&!S.building&&!$('#sheet').classList.contains('on'))load().then(()=>render('home',true)).catch(()=>{})});
boot();
</script>
</body>
</html>
