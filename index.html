<style>
:root{--c:#38BDF8;--c2:#0EA5E9;--c3:#0369A1;--bg:#F0F9FF;--line:#BAE6FD;--ink:#0B2A3C;--mut:#4B6B80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E0F2FE;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:calc(env(safe-area-inset-top) + 25px) 0 0 0;overflow-y:auto;padding:28px 20px calc(env(safe-area-inset-bottom) + 40px)}
.screen.tabbed{padding-bottom:calc(env(safe-area-inset-bottom) + 104px)}
h1{margin:0;font-size:28px;font-weight:800;line-height:1.15} h2{margin:0 0 12px;font-size:18px;font-weight:800}
p{margin:0;line-height:1.5} a{color:var(--c3)} .mut{color:var(--mut);font-size:13px} .col{display:flex;flex-direction:column;gap:20px} .g12{display:flex;flex-direction:column;gap:12px} .row{display:flex;align-items:center;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--c);color:var(--ink);font:800 16px Inter,sans-serif;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)} .btn.sec{background:#fff;border:1px solid var(--c3)} .btn:disabled{background:#E0F2FE;color:var(--mut);cursor:default;transform:none}
.btn.dan{background:#fff;border:1px solid #B91C1C;color:#B91C1C}
.link{background:none;border:0;padding:8px 0;font:600 14px Inter,sans-serif;color:var(--c3);cursor:pointer;text-align:left}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;background:var(--c2);border-radius:7px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.s{height:12px} .bar.s i{background:var(--c)}
.gift{flex:none;width:48px;height:48px;border-radius:24px;background:var(--c);display:flex;align-items:center;justify-content:center}
.gift.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.rise{opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;flex-wrap:wrap} .dots span{width:16px;height:16px;border-radius:8px;border:2px solid var(--c2)} .dots span.on{background:var(--c2)}
.av{width:40px;height:40px;border-radius:20px;background:var(--c);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.free{border:2px dashed var(--c2);background:none}
.chip{display:inline-block;background:var(--c);font-size:13px;font-weight:800;border-radius:12px;padding:6px 10px;white-space:nowrap}
.chip.g{background:#BBF7D0} .chip.y{background:#FEF08A} .chip.n{background:#E5E7EB}
.back{background:none;border:0;font:600 15px Inter,sans-serif;color:var(--c3);padding:8px 0;cursor:pointer;margin-bottom:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800}
input[type=text],input[type=date],input[type=time],input[type=number],textarea{min-height:48px;width:100%;border:1px solid var(--c3);border-radius:12px;padding:0 12px;font:400 16px Inter,sans-serif;color:var(--ink);background:#fff}
textarea{padding:12px;resize:none}
select{min-height:48px;width:100%;border:1px solid var(--c3);border-radius:12px;padding:0 12px;font:400 16px Inter,sans-serif;background:#fff;color:var(--ink)} .btn.sm{min-height:40px;font-size:14px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;text-align:left} .chk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--c3)}
.star{width:48px;height:48px;border:0;background:none;padding:0;cursor:pointer;transition:transform .15s} .star:active{transform:scale(.85)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .kpi b{display:block;font-size:30px;font-weight:800;margin-top:4px}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px} .cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px}
.cols i{display:block;width:100%;height:0;background:var(--c);border-radius:6px 6px 0 0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.map{height:280px;border-radius:16px;overflow:hidden;isolation:isolate;border:1px solid var(--line);background:#E0F2FE} .map.s{height:200px}
.code{font:600 13px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:4px}
ol.steps{margin:0;padding-left:20px;line-height:1.6;font-size:14px;display:flex;flex-direction:column;gap:8px}
.sep{border-top:1px solid #E0F2FE;padding-top:12px}
#hdr{position:absolute;top:0;left:0;right:0;z-index:6;background:#38BDF8;padding-top:env(safe-area-inset-top);display:flex;justify-content:center}
#hdr img{display:block;height:48px;width:auto}
#tabs{position:absolute;left:0;right:0;bottom:0;display:none;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
#tabs button{flex:1;min-height:48px;border:0;background:none;font:600 14px Inter,sans-serif;color:var(--mut);cursor:pointer;position:relative}
#tabs button.on{color:var(--c3);font-weight:800} #tabs button.on::after{content:"";position:absolute;left:30%;right:30%;top:-6px;height:3px;border-radius:2px;background:var(--c2)}
#toast{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;transform:translateY(30px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);z-index:11}
#toast.on{transform:none;opacity:1}
#menuBtn{position:absolute;right:4px;top:env(safe-area-inset-top,0px);width:48px;height:48px;border:0;background:none;display:none;align-items:center;justify-content:center;cursor:pointer}
#menu{position:absolute;inset:0;z-index:8;visibility:hidden;pointer-events:none;transition:visibility 0s linear .3s}
#menu.on{visibility:visible;pointer-events:auto;transition:none}
#menu .bk{position:absolute;inset:0;width:100%;border:0;padding:0;background:rgba(11,42,60,.45);opacity:0;transition:opacity .25s}
#menu.on .bk{opacity:1}
#menu .pn{position:absolute;top:0;right:0;bottom:0;width:min(300px,82%);background:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:4px}
#menu.on .pn{transform:none}
.mi{display:flex;align-items:center;width:100%;min-height:52px;border:0;background:none;border-radius:12px;padding:0 12px;font:600 16px Inter,sans-serif;color:var(--ink);text-align:left;cursor:pointer}
.mi:active{background:var(--bg)}
#gate{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);background:rgba(11,42,60,.65)}
#gate.on{display:flex}
#gate .card{width:100%;max-height:100%;overflow-y:auto;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.seg{display:flex;gap:2px;background:#E0F2FE;border-radius:12px;padding:3px}
.seg button{border:0;background:none;font:800 12px Inter,sans-serif;color:var(--mut);padding:0 10px;min-height:34px;border-radius:10px;cursor:pointer}
.seg button.on{background:#fff;color:var(--c3)}
.chart{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.chart::-webkit-scrollbar{display:none}
.chart.all{overflow:visible;scroll-snap-type:none}
.trk{display:flex}
.sl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;scroll-snap-align:start;cursor:pointer}
.bw{width:100%;height:105px;display:flex;align-items:flex-end;justify-content:center}
.bw i{display:block;width:66.67%;height:0;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#FF4A1C,#FFE04A);transition:height 1s cubic-bezier(.2,.8,.2,1)}
.lb{margin-top:10px;font-size:13px;color:#555;white-space:nowrap;height:18px}
.sl.sel .lb{color:var(--ink);font-weight:800}
#gate .card.win{position:relative;overflow:hidden;text-align:center;align-items:center}
.win>*{position:relative;z-index:1}
.cf{position:absolute!important;top:-16px;z-index:0!important;width:8px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear 3 forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(560px) rotate(540deg)}}
.sk{background:linear-gradient(90deg,#E0F2FE 25%,#F0F9FF 50%,#E0F2FE 75%);background-size:200% 100%;animation:shim 1.2s infinite linear;border-radius:20px}
@keyframes shim{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"><header id="hdr"><img src="logopaseando.png" alt="Paseando" height="25"><button id="menuBtn" data-act="menu" aria-label="Abrir menú" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B2A3C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header><main class="screen" id="skel" aria-hidden="true"><div class="col"><div class="g12"><div class="sk" style="height:16px;width:90px;border-radius:8px"></div><div class="sk" style="height:40px;width:200px;border-radius:10px"></div></div><div class="sk" style="height:258px"></div><div class="sk" style="height:220px"></div></div></main><nav id="tabs"></nav><div id="menu"></div><div id="gate" role="dialog" aria-modal="true" aria-labelledby="gt"></div><div id="toast" role="status"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIG ============
   Project Settings > API en Supabase. La clave "anon" es pública (la protege RLS).
   NUNCA pongas acá la clave service_role. */
const SUPABASE_URL='https://brlhcorgjnaipmokhmhj.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJybGhjb3Jnam5haXBtb2tobWhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MzAyMzgsImV4cCI6MjExMDIwNjIzOH0.49WI6fH9wxiYNgXo5jjaa4VwfvPOjx5Y_NLlIgx06v8';
const TZ='America/Argentina/Buenos_Aires';
const SYNC_URL=SUPABASE_URL+'/functions/v1/sync-steps';
const DEF_POS=[-34.5745,-58.4150]; /* Bosques de Palermo */
const SHORTCUT_URL='https://www.icloud.com/shortcuts/ac01fdc4038c4caa84f02f549493570a';
const SHORTCUT_NAME='Paseando';
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const fmt=(n,d=0)=>(+n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const star="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z";
const stars=(n,s=14)=>`<svg width="${s*5+8}" height="${s}" role="img" aria-label="${n} de 5">${[0,1,2,3,4].map(i=>`<path transform="translate(${i*(s+2)} 0) scale(${s/24})" d="${star}" fill="${i<n?'#0EA5E9':'none'}" stroke="#0369A1" stroke-width="1.5"/>`).join('')}</svg>`;
const giftSvg='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B2A3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8c-2.5 0-4.5-.8-4.5-2.5S9.5 3 12 8zm0 0c2.5 0 4.5-.8 4.5-2.5S14.5 3 12 8z"/></svg>';
/* Si preferís el logo embebido, reemplazá 'icon.png' por tu data:image/png;base64,... */
const LOGO='icon.png';
const logo=`<img src="${LOGO}" alt="Paseando" width="120" height="120" style="width:120px;height:120px;border-radius:30px;display:block;box-shadow:0 8px 24px rgba(14,165,233,.35)">`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dt=(iso,o)=>new Date(iso).toLocaleString('es-AR',{timeZone:TZ,...o});
const fecha=iso=>cap(dt(iso,{weekday:'long',day:'numeric',month:'long'}));
const hora=iso=>dt(iso,{hour:'2-digit',minute:'2-digit',hour12:false});
const dur=m=>((m>=60?Math.floor(m/60)+' h ':'')+(m%60?m%60+' min':'')).trim();
const DAYN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const hoyAR=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const lunes=()=>{const d=new Date(hoyAR()+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toLocaleDateString('en-CA')};
const dl=d=>d===hoyAR()?'Hoy':DAYN[new Date(d+'T12:00:00').getDay()];
const ultimos=n=>{const b=new Date(hoyAR()+'T12:00:00');return Array.from({length:n},(_,i)=>{const d=new Date(b);d.setDate(b.getDate()-(n-1-i));return d.toLocaleDateString('en-CA')})};
const dm=d=>{const x=new Date(d+'T12:00:00');return x.getDate()+'/'+(x.getMonth()+1)};
const skipped=id=>{try{return localStorage.getItem('skip_'+id)==='1'}catch(e){return false}};
const skipWalk=id=>{try{localStorage.setItem('skip_'+id,'1')}catch(e){}};
const q=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const dots=(n,c)=>`<div class="dots">${Array.from({length:c},(_,i)=>`<span class="${i<n?'on':''}"></span>`).join('')}</div><p class="mut" style="margin-top:8px">${n} de ${c} lugares ocupados. Si se llena, aplicás a la del finde siguiente.</p>`;
const rev=r=>`<div style="border-top:1px solid #E0F2FE;padding-top:12px"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${esc(r.nombre)} ${esc(r.apellido_inicial)}</b>${stars(r.estrellas)}</div><p style="font-size:14px;margin-top:4px">${esc(r.comentario)}</p></div>`;
const chipE=w=>w.estado==='borrador'?'<span class="chip y">Borrador</span>':w.estado==='finalizada'?'<span class="chip n">Finalizada</span>':new Date(w.inicia_at)<new Date()?'<span class="chip y">Por finalizar</span>':'<span class="chip g">Activa</span>';
const mapsLink=w=>`https://www.google.com/maps/dir/?api=1&destination=${w.punto_lat},${w.punto_lng}`;
let S={},cur=null,RATE=0,idx=0,WID=null,EID=null,nav=0,PICK=null,PM=null;

/* ============ DATOS (Supabase) ============ */
function applySteps(logs,dias30){
 const by={};logs.forEach(l=>by[l.dia]=(by[l.dia]||0)+l.pasos);
 S.d30=dias30.map(d=>[d,by[d]||0]);
 S.dias=S.d30.filter(x=>x[0]>=lunes()&&x[1]>0);S.pasos=S.dias.reduce((a,b)=>a+b[1],0)}
async function load(){
 const uid=S.uid,now=new Date().toISOString(),dias30=ultimos(30);
 /* Fase 1: todo lo independiente, en paralelo */
 const [p,adm,wf,wl,logs,any,pw]=await Promise.all([
  q(sb.from('profiles').select('*').eq('id',uid).single()),
  q(sb.rpc('is_admin')),
  q(sb.from('walks').select('*').eq('estado','publicada').gte('inicia_at',now).order('inicia_at').limit(1)),
  q(sb.from('walks').select('*').eq('estado','publicada').order('inicia_at',{ascending:false}).limit(1)),
  q(sb.from('step_logs').select('dia,pasos').eq('user_id',uid).gte('dia',dias30[0])),
  q(sb.from('step_logs').select('dia').eq('user_id',uid).limit(1)),
  q(sb.from('walks').select('*').eq('estado','finalizada').order('inicia_at',{ascending:false}).limit(10))]);
 S.p=p;S.admin=adm;
 if(!S.p.acepto_terminos_at&&localStorage.getItem('consent')==='1'){
  const t=new Date().toISOString();await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:t}).eq('id',uid));
  S.p.mayor_de_18=true;S.p.acepto_terminos_at=t;localStorage.removeItem('consent')}
 const w=wf[0]||wl[0]||null;
 S.w=w;S.ok=[];S.yo=false;S.ocu=0;S.synced=any.length>0;
 applySteps(logs,dias30);
 const ids=pw.map(x=>x.id);S.past=[];
 /* Fase 2: lo que depende de la fase 1, también en paralelo */
 const [st,sig,mw,pb]=await Promise.all([
  w?q(sb.from('walk_stats').select('*').eq('walk_id',w.id).maybeSingle()):null,
  w?q(sb.from('walk_signups').select('estado').eq('walk_id',w.id).eq('user_id',uid).maybeSingle()):null,
  S.admin?q(sb.from('walks').select('*').in('estado',['publicada','borrador']).order('inicia_at',{ascending:false})):[],
  ids.length?Promise.all([q(sb.from('walk_stats').select('*').in('walk_id',ids)),q(sb.from('reviews_public').select('*').in('walk_id',ids).order('created_at',{ascending:false})),q(sb.from('walk_signups').select('walk_id').eq('user_id',uid).eq('estado','asistio')),q(sb.from('reviews').select('walk_id').eq('user_id',uid))]):null]);
 if(w){S.ocu=st?st.ocupados:0;S.yo=!!sig&&sig.estado!=='cancelado'}
 S.mine=mw;
 if(pb){const [pst,rv,asi,mr]=pb;
  S.past=pw.map(x=>{const s2=pst.find(y=>y.walk_id===x.id)||{};return{w:x,n:s2.asistentes||0,prom:s2.promedio,rev:rv.filter(r=>r.walk_id===x.id),can:asi.some(y=>y.walk_id===x.id)&&!mr.some(m=>m.walk_id===x.id)}})}
 if(S.yo)S.ok=await q(sb.rpc('asistentes_caminata',{p_walk:w.id}));
}
async function refreshSteps(){
 if(!sb||!S.uid||document.hidden||!cur||cur.name!=='home')return;
 try{const d=ultimos(30),logs=await q(sb.from('step_logs').select('dia,pasos').eq('user_id',S.uid).gte('dia',d[0]));
  const before=JSON.stringify(S.d30||[]);applySteps(logs,d);
  if(JSON.stringify(S.d30)!==before){if(logs.length)S.synced=true;if(cur&&cur.name==='home')go('home',null,'fade')}}catch(e){}}
async function loadAW(){S.aw=await q(sb.from('walks').select('*').order('inicia_at',{ascending:false}).limit(50))}
async function getTok(){
 let r=await q(sb.from('sync_tokens').select('token').eq('user_id',S.uid).maybeSingle());
 if(!r){await q(sb.from('sync_tokens').insert({user_id:S.uid}));r=await q(sb.from('sync_tokens').select('token').eq('user_id',S.uid).single())}
 return r.token}
const PRE={
home:async()=>{if(S.dirty){await load();S.dirty=false}},
past:async()=>{if(S.dirty){await load();S.dirty=false}},
sync:async()=>{S.tok=await getTok()},
admin:async()=>{
 if(idx===0)S.res=await q(sb.rpc('admin_resumen'));
 if(idx===1){await loadAW();S.ws={};const ids=S.aw.map(x=>x.id);
  if(ids.length)(await q(sb.from('walk_stats').select('*').in('walk_id',ids))).forEach(s=>S.ws[s.walk_id]=s)}
 if(idx===2){S.ew=null;if(EID)S.ew=await q(sb.from('walks').select('*').eq('id',EID).single())}
 if(idx===3){await loadAW();
  if(!WID||!S.aw.some(x=>String(x.id)===String(WID)))WID=S.aw[0]?S.aw[0].id:null;S.sg=[];S.rv=[];
  if(WID){[S.sg,S.rv]=await Promise.all([q(sb.from('walk_signups').select('user_id,estado,profiles(nombre,apellido,email)').eq('walk_id',WID)),q(sb.from('reviews').select('estrellas,comentario,profiles(nombre,apellido)').eq('walk_id',WID))])}}}};

/* ============ MAPAS ============ */
function mkMap(id,lat,lng,z){
 const m=L.map(id,{scrollWheelZoom:false}).setView([lat,lng],z);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
 setTimeout(()=>m.invalidateSize(),450);return m}
let LP=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(LP)return LP;
 LP=new Promise((ok,no)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);
  const j=document.createElement('script');j.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';j.onload=ok;j.onerror=()=>{LP=null;no(new Error('mapa'))};document.head.appendChild(j)});return LP}
function initPicker(){if(!$('#pmap'))return;loadLeaflet().then(()=>{if($('#pmap'))buildPicker()}).catch(()=>{const el=$('#pmap');if(el)el.innerHTML='<p class="mut" style="padding:16px">No se pudo cargar el mapa.</p>'})}
function buildPicker(){
 const el=$('#pmap');if(!el||!window.L){if(el)el.innerHTML='<p class="mut" style="padding:16px">No se pudo cargar el mapa.</p>';return}
 const e=S.ew;PICK=e&&e.punto_lat!=null?{lat:e.punto_lat,lng:e.punto_lng}:null;
 const m=mkMap('pmap',PICK?PICK.lat:DEF_POS[0],PICK?PICK.lng:DEF_POS[1],PICK?16:15);let mk=null;
 const info=()=>{const n=$('#pinfo');if(n)n.textContent=PICK?`Punto elegido: ${PICK.lat.toFixed(5)}, ${PICK.lng.toFixed(5)} (podés arrastrar el marcador)`:'Tocá el mapa para marcar el punto de encuentro.'};
 const put=(lat,lng)=>{PICK={lat,lng};if(mk)mk.setLatLng([lat,lng]);else{mk=L.marker([lat,lng],{draggable:true}).addTo(m);mk.on('dragend',()=>{const p=mk.getLatLng();PICK={lat:p.lat,lng:p.lng};info()})}info()};
 const clear=()=>{if(mk){m.removeLayer(mk);mk=null}PICK=null;info()};
 if(PICK)put(PICK.lat,PICK.lng);else info();
 m.on('click',ev=>put(ev.latlng.lat,ev.latlng.lng));
 PM={m,put,clear}}
function post(name){
 if(name==='home')initChart();
 if(name==='admin'&&idx===2)initPicker();
 if(name==='walk'&&S.w&&S.w.punto_lat!=null)loadLeaflet().then(()=>{if(!$('#wmap'))return;const m=mkMap('wmap',S.w.punto_lat,S.w.punto_lng,16);L.marker([S.w.punto_lat,S.w.punto_lng]).addTo(m)}).catch(()=>{})}

/* ============ ROUTER Y ANIMACIONES ============ */
function enhance(el){
 el.querySelectorAll('.rise').forEach((n,i)=>n.style.animationDelay=Math.min(i*70,700)+'ms');
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  el.querySelectorAll('[data-w]').forEach(n=>n.style.width=n.dataset.w+'%');
  el.querySelectorAll('[data-h]').forEach(n=>n.style.height=n.dataset.h+'%')}));
 el.querySelectorAll('[data-count]').forEach(n=>{const to=+n.dataset.count,d=+(n.dataset.dec||0),t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-k,3);n.textContent=fmt(to*e,d);if(k<1)requestAnimationFrame(f)})(t0)});
}
function tabs(on){const t=$('#tabs');if(on==null){t.style.display='none';return}t.style.display='flex';
 t.innerHTML=['Resumen','Caminatas',EID?'Editar':'Crear','Asistentes'].map((n,i)=>`<button class="${i===on?'on':''}" data-go="admin" data-arg="${i}"${i===2?' data-edit=""':''}>${n}</button>`).join('')}
async function go(name,arg,back){
 const my=++nav;if(arg!=null)idx=+arg;
 if(PRE[name]){try{await PRE[name]()}catch(e){toast(e.message||'No se pudo cargar')}}
 if(my!==nav)return;
 const old=cur&&cur.el;
 const el=document.createElement('main');el.className='screen'+(name==='admin'?' tabbed':'');el.innerHTML=V[name]();
 $('#app').insertBefore(el,$('#tabs'));cur={name,el};closeMenu();$('#menuBtn').style.display=HIDE_MENU.includes(name)?'none':'flex';syncGate();tabs(name==='admin'?idx:null);RATE=0;enhance(el);post(name);
 const dir=back==='fade'?0:back?-28:28;
 el.animate([{transform:`translateX(${dir}px)`,opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});
 if(old){old.style.pointerEvents='none';old.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}).onfinish=()=>old.remove()}
 el.scrollTop=0}
function stepsCard(anim){
 const D=S.d30||[],n=D.length,r=S.range===30?30:7,mx=Math.max(1,...D.map(x=>x[1])),pk=S.pick==null?n-1:S.pick;
 const bars=D.map((x,i)=>{const v=x[1],h=v>0?Math.max(6,v/mx*100):3,lb=(r===7||(n-1-i)%5===0)?dm(x[0]):'';
  return `<div class="sl${i===pk?' sel':''}" data-act="pick" data-i="${i}"><div class="bw"><i data-h="${h}"${v>0?'':' style="opacity:.35"'}></i></div><span class="lb"${r===30?' style="font-size:11px"':''}>${lb}</span></div>`}).join('');
 const x=D[pk];
 return `<div class="card g12${anim?' rise':''}" id="stp"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Día a día</h2><div class="seg"><button class="${r===7?'on':''}" data-act="range" data-v="7">7 días</button><button class="${r===30?'on':''}" data-act="range" data-v="30">30 días</button></div></div>
<div class="chart${r===30?' all':''}" id="cht"><div class="trk" style="width:${r===7?n/7*100:100}%">${bars}</div></div>
<p class="mut" id="sread" style="text-align:center">${x?`${dl(x[0])} ${dm(x[0])} · ${fmt(x[1])} pasos`:''}</p></div>`}
function initChart(){const c=$('#cht');if(!c)return;
 requestAnimationFrame(()=>{if(!c.classList.contains('all'))c.scrollLeft=c.scrollWidth;
  requestAnimationFrame(()=>c.querySelectorAll('[data-h]').forEach(n=>n.style.height=n.dataset.h+'%'))})}
const HIDE_MENU=['login','consent','setup'];
function openMenu(){const m=$('#menu');
 m.innerHTML=`<button class="bk" data-act="closemenu" aria-label="Cerrar menú"></button><div class="pn" role="dialog" aria-label="Menú"><div class="row" style="justify-content:space-between"><b style="font-size:18px;padding-left:12px">Menú</b><button class="mi" style="width:48px;justify-content:center;padding:0" data-act="closemenu" aria-label="Cerrar">✕</button></div>
<button class="mi" data-go="past">Caminatas anteriores</button><button class="mi" data-go="terms">Términos</button>${S.admin?'<button class="mi" data-go="admin" data-arg="0">Panel admin</button>':''}
<div class="sep" style="margin-top:8px"></div><button class="mi" data-act="logout" style="color:#B91C1C">Cerrar sesión</button></div>`;
 m.classList.add('on');$('#menuBtn').setAttribute('aria-expanded','true')}
function closeMenu(){$('#menu').classList.remove('on');$('#menuBtn').setAttribute('aria-expanded','false')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
async function syncGate(){
 const g=$('#gate');
 const hide=()=>{g.classList.remove('on');g.innerHTML='';g.dataset.k=''};
 if(!(cur&&cur.name==='home'))return hide();
 if(S.synced){
  const w=S.w;
  if(!(w&&!S.yo&&S.pasos>=w.meta_pasos&&!skipped(w.id)))return hide();
  const key='win'+w.id;if(g.classList.contains('on')&&g.dataset.k===key)return;
  const cf=Array.from({length:18},(_,i)=>`<span class="cf" style="left:${(i*37+5)%100}%;background:${['#38BDF8','#FF5A1F','#FFD93D','#0EA5E9','#86EFAC'][i%5]};animation-delay:${(i%6)*.25}s;animation-duration:${2.4+(i%4)*.5}s"></span>`).join('');
  const quedan=Math.max(0,w.cupo_max-S.ocu);
  g.innerHTML=`<div class="card g12 win">${cf}<div class="gift pop" style="width:76px;height:76px;border-radius:38px">${giftSvg.replace('width="26" height="26"','width="40" height="40"')}</div><h2 id="gt" style="margin:0;font-size:26px">¡Lo lograste!</h2><p style="font-size:15px">Llegaste a <b>${fmt(S.pasos)} pasos</b> y desbloqueaste la caminata.</p><div class="sep" style="width:100%"><p style="font-weight:800">${fecha(w.inicia_at)}, ${hora(w.inicia_at)}</p><p style="font-size:14px;margin-top:2px">${esc(w.lugar)}</p>${quedan?`<p class="mut" style="margin-top:4px">Quedan ${quedan} lugares</p>`:''}</div><button class="btn" data-act="join">Aceptar caminata</button><button class="btn sec" data-act="skipwin">Guardarme para la próxima</button></div>`;
  g.dataset.k=key;g.classList.add('on');return}
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
 let body;
 if(ios){
  try{S.tok=await getTok()}catch(e){toast(e.message||'No se pudo cargar')}
  if(!(cur&&cur.name==='home'&&!S.synced))return;
  const back=encodeURIComponent(location.href.split('#')[0]);
  const run=`shortcuts://x-callback-url/run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=text&text=${encodeURIComponent(S.tok||'')}&x-success=${back}&x-cancel=${back}&x-error=${back}`;
  body=`<div class="g12"><div><p class="mut">Paso 1 · Solo la primera vez</p><a class="btn" href="${SHORTCUT_URL}" style="text-decoration:none;display:flex;align-items:center;justify-content:center;margin-top:6px">Instalar atajo</a><p class="mut" style="margin-top:6px">Se abre la app Atajos. Tocá <b>Agregar atajo</b>.</p></div>
<div class="sep"><p class="mut">Paso 2</p><a class="btn" href="${esc(run)}" style="text-decoration:none;display:flex;align-items:center;justify-content:center;margin-top:6px">Sincronizar ahora</a><p class="mut" style="margin-top:6px">iOS te va a pedir permiso para leer tus pasos de Salud. Tocá <b>Permitir</b>. Después vuelve solo a Paseando.</p></div>
<button class="btn sec" data-act="chksync">Ya sincronicé</button></div>`}
 else body=`<p style="font-size:14px">Para continuar necesitás sincronizar tus pasos desde un iPhone. Abrí Paseando en tu iPhone y seguí los pasos de esta ventana.</p>`;
 g.innerHTML=`<div class="card g12"><h2 id="gt" style="margin:0">Conectá tus pasos</h2><p style="font-size:14px">Para usar Paseando tenés que sincronizar tus pasos. Un atajo lee la app Salud y los manda a tu cuenta. Esta ventana se cierra sola cuando recibimos tus primeros pasos.</p>${body}<button class="link" data-act="logout" style="text-align:center">Cerrar sesión</button></div>`;
 g.dataset.k='sync';g.classList.add('on')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}
const csv=(name,rows)=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));l.download=name;l.click()};
const afterDel=()=>{S.dirty=true;toast('Caminata eliminada');EID=null;if(cur.name==='home'){go('home',null,'fade')}else go('admin',1,'fade')};

document.addEventListener('click',async e=>{
 const s=e.target.closest('[data-star]');
 if(s){RATE=+s.dataset.star;document.querySelectorAll('#stars .star').forEach((b,i)=>{const p=b.querySelector('path');p.setAttribute('fill',i<RATE?'#0EA5E9':'none');if(i<RATE)b.animate([{transform:'scale(.7)'},{transform:'scale(1)'}],{duration:300,delay:i*40,easing:'cubic-bezier(.3,1.6,.5,1)'})});chk();return}
 const t=e.target.closest('[data-go],[data-act]');if(!t||t.disabled)return;
 if(t.closest('#menu'))closeMenu();
 if(t.dataset.edit!==undefined)EID=t.dataset.edit||null;
 if(t.dataset.wid)WID=t.dataset.wid;
 if(t.dataset.go){e.preventDefault();go(t.dataset.go,t.dataset.arg,['home','login','consent'].includes(t.dataset.go)&&cur.name!=='login'&&cur.name!=='consent');return}
 const a=t.dataset.act;
 try{
 if(a==='chksync'){t.disabled=true;await load();if(S.synced){go('home',null,'fade')}else{toast('Todavía no recibimos tus pasos. Corré el atajo y volvé.');t.disabled=false}}
 if(a==='menu')openMenu();
 if(a==='pick'){const i=+t.dataset.i,x=S.d30[i];S.pick=i;$('#sread').textContent=`${dl(x[0])} ${dm(x[0])} · ${fmt(x[1])} pasos`;document.querySelectorAll('#cht .sl').forEach((n,k)=>n.classList.toggle('sel',k===i))}
 if(a==='range'){S.range=+t.dataset.v;S.pick=null;$('#stp').outerHTML=stepsCard(false);initChart()}
 if(a==='skipwin'){skipWalk(S.w.id);syncGate()}
 if(a==='login'){localStorage.setItem('consent','1');await q(sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}))}
 if(a==='accept'){const ts=new Date().toISOString();await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:ts}).eq('id',S.uid));S.p.acepto_terminos_at=ts;await load();go('home')}
 if(a==='logout'){await sb.auth.signOut();S={};go('login',null,true)}
 if(a==='join'){t.disabled=true;const r=await q(sb.rpc('join_walk',{p_walk:S.w.id}));await load();
  if(r==='completa'){skipWalk(S.w.id);toast('Se completó el cupo. Aplicás a la caminata del finde siguiente.');go('home',null,'fade')}else{toast('¡Listo! Te anotaste a la caminata');go('walk')}}
 if(a==='publish'){t.disabled=true;const p=S.past[idx];await q(sb.from('reviews').insert({walk_id:p.w.id,user_id:S.uid,estrellas:RATE,comentario:$('#cm').value.trim()}));await load();toast('¡Gracias por tu reseña!');go('past',null,true)}
 if(a==='create'||a==='draft'||a==='save'){const g=i=>$('#a'+i).value;if(!g(1)||!g(2)||!g(3)){toast('Completá nombre, fecha y hora');return}
  t.disabled=true;
  const row={titulo:g(1).trim(),inicia_at:new Date(`${g(2)}T${g(3)}:00-03:00`).toISOString(),lugar:g(4).trim()||'Bosques de Palermo',punto_encuentro:g(5).trim()||null,punto_lat:PICK?PICK.lat:null,punto_lng:PICK?PICK.lng:null,duracion_min:+g(6),cupo_max:+g(7),meta_pasos:+g(8),sponsor:g(9).trim()||null,incluye:g(11).trim()||null,que_llevar:g(12).trim()||null};
  let r;
  if(a==='save'){row.estado=g(13);r=await q(sb.from('walks').update(row).eq('id',EID).select('id'))}
  else{row.estado=a==='create'?'publicada':'borrador';r=await q(sb.from('walks').insert(row).select('id'))}
  if(!r||!r.length)throw new Error('No se guardó. Revisá los permisos de admin en Supabase (corré migracion.sql).');
  S.dirty=true;EID=null;
  toast(a==='save'?'Cambios guardados':a==='create'?'Caminata publicada: ya aparece en la app':'Borrador guardado');
  go('admin',1,'fade')}
 if(a==='toggle'){const r=await q(sb.from('walks').update({estado:t.dataset.v}).eq('id',t.dataset.id).select('id'));if(!r.length)throw new Error('No se pudo cambiar el estado');S.dirty=true;toast(t.dataset.v==='publicada'?'Caminata publicada':'Pasada a borrador');go('admin',1,'fade')}
 if(a==='del'){if(!confirm('¿Eliminar esta caminata? También se borran sus inscripciones y reseñas.'))return;await q(sb.rpc('admin_delete_walk',{p_walk:String(t.dataset.id)}));afterDel()}
 if(a==='att'){await q(sb.from('walk_signups').update({estado:t.dataset.v}).eq('walk_id',WID).eq('user_id',t.dataset.u));go('admin',3,'fade')}
 if(a==='fin'){await q(sb.from('walks').update({estado:'finalizada'}).eq('id',WID));S.dirty=true;toast('Caminata finalizada');go('admin',3,'fade')}
 if(a==='csv')csv('asistentes.csv',['nombre,apellido,mail,estado',...S.sg.map(x=>[x.profiles.nombre,x.profiles.apellido,x.profiles.email,x.estado].join(','))]);
 if(a==='csvres'){const R=S.res||{};csv('resumen.csv',['metrica,valor',`usuarios,${R.usuarios}`,`activos_semana,${R.activos_semana}`,`pasos_semana,${R.pasos_semana}`,`caminatas,${R.caminatas}`,`calificacion,${R.calificacion??''}`])}
 if(a==='geo'){const v=$('#a10').value.trim();if(!v)return;
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(v));const j=await r.json();
  if(!j[0]){toast('No encontré ese lugar');return}
  PM.m.setView([+j[0].lat,+j[0].lon],17);PM.put(+j[0].lat,+j[0].lon)}
 if(a==='myloc'){if(!navigator.geolocation){toast('Tu navegador no permite ubicación');return}
  navigator.geolocation.getCurrentPosition(p=>{PM.m.setView([p.coords.latitude,p.coords.longitude],17);PM.put(p.coords.latitude,p.coords.longitude)},()=>toast('No pudimos obtener tu ubicación'),{enableHighAccuracy:true,timeout:10000})}
 if(a==='clearpin')PM.clear();
 if(a==='copyurl'||a==='copytok'){await navigator.clipboard.writeText(a==='copyurl'?SYNC_URL:S.tok);toast('Copiado')}
 if(a==='regen'){if(!confirm('Tu atajo actual dejará de funcionar hasta que le pegues la clave nueva. ¿Continuar?'))return;
  const n=crypto.randomUUID();await q(sb.from('sync_tokens').update({token:n}).eq('user_id',S.uid));go('sync',null,'fade');toast('Clave nueva generada')}
 }catch(err){toast(err.message||'Ocurrió un error');if(t)t.disabled=false}
});
document.addEventListener('input',e=>{
 if(e.target.id==='ok18')$('#google').disabled=!e.target.checked;
 if(e.target.id==='cm'){$('#cnt').textContent=e.target.value.length+'/100';chk()}});
document.addEventListener('change',e=>{if(e.target.id==='wsel'){WID=e.target.value;go('admin',3,'fade')}});
function chk(){const b=$('#pub');if(b)b.disabled=!(RATE>0&&$('#cm').value.trim().length>0)}

/* ============ INICIO ============ */
async function boot(){
 cur={name:'skel',el:$('#skel')};
 if(!sb){go('setup');return}
 const{data:{session}}=await sb.auth.getSession();
 if(!session){go('login');return}
 S.uid=session.user.id;
 try{await load();go(S.p.acepto_terminos_at?'home':'consent');setTimeout(autoSync,1500)}catch(e){toast(e.message||'No se pudo cargar');go('login')}
}
/* Para la app nativa (Capacitor/Flutter webview): después de leer Apple Health / Health Connect
   llamar Paseando.syncSteps([{dia:'2026-11-14',hora:9,pasos:1200}, ...]) */
window.Paseando={syncSteps:async rows=>{await q(sb.from('step_logs').upsert(rows.map(x=>({user_id:S.uid,dia:x.dia,hora:x.hora,pasos:x.pasos})),{onConflict:'user_id,dia,hora'}));S.dirty=true;if(cur&&cur.name==='home'){await load();S.dirty=false;go('home',null,'fade')}}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sb&&S.uid&&cur&&cur.name==='home')load().then(()=>go('home',null,'fade')).catch(()=>{}).then(()=>setTimeout(autoSync,1500))});
/* Sincronización automática al abrir (solo iPhone, usuarios que ya sincronizaron).
   Lanza el atajo como máximo una vez cada AUTO_MIN minutos. */
const AUTO_MIN=30;
async function autoSync(){
 if(!/iPhone|iPad|iPod/.test(navigator.userAgent)||!sb||!S.uid||!S.synced||document.hidden||!cur||cur.name!=='home')return;
 let last=0;try{last=+localStorage.getItem('autosync')||0}catch(e){return}
 if(Date.now()-last<AUTO_MIN*60000)return;
 try{localStorage.setItem('autosync',String(Date.now()))}catch(e){return}
 try{S.tok=await getTok()}catch(e){return}
 const back=encodeURIComponent(location.href.split('#')[0]);
 location.href=`shortcuts://x-callback-url/run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=text&text=${encodeURIComponent(S.tok)}&x-success=${back}&x-cancel=${back}&x-error=${back}`}
setInterval(refreshSteps,15000);
boot();
</script>
