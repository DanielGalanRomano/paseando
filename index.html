<style>
:root{--c:#3680F7;--c2:#1E54B8;--bg:#F4F8FF;--line:#CFE0FC;--soft:#E1ECFE;--ink:#0B1426;--mut:#51617A;--ok:#15803D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#DCE8FD;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
#hdr{position:absolute;top:0;left:0;right:0;height:0;z-index:6}
#menuBtn{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:46px;height:46px;border:0;border-radius:23px;background:rgba(11,20,38,.4);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:8}
.screen{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 110px)}
h1{margin:0;font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.03em} h2{margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:-.02em}
p{margin:0;line-height:1.5} a{color:var(--c2);font-weight:600} .mut{color:var(--mut);font-size:13px}
.col{display:flex;flex-direction:column;gap:22px} .g12{display:flex;flex-direction:column;gap:12px} .row{display:flex;align-items:center;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:2px solid var(--c);border-radius:16px;background:var(--c);color:#fff;font:700 16px 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .15s,background .25s,color .25s,border-color .25s}
.btn:active{transform:scale(.97)} .btn.out{background:#fff;color:var(--c2);border-color:var(--c)} .btn.dan{background:#fff;color:#7F1D1D;border-color:#7F1D1D}
.btn:disabled{background:var(--soft);border-color:var(--soft);color:var(--mut);cursor:default;transform:none} .btn.sm{min-height:42px;font-size:14px;border-radius:12px}
.btn.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)} @keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.link{background:none;border:0;padding:8px 0;font:600 14px 'Plus Jakarta Sans',sans-serif;color:var(--c2);cursor:pointer}
.chip{display:inline-block;background:var(--soft);color:var(--c2);font-size:12px;font-weight:700;border-radius:10px;padding:5px 9px;white-space:nowrap}
.chip.g{background:#DCFCE7;color:var(--ok)} .chip.live{background:var(--c);color:#fff;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.6}}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c2),var(--c));border-radius:7px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.rise{opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards} .still .rise{animation:none;opacity:1;transform:none}
@keyframes rise{to{opacity:1;transform:none}}
.av{width:40px;height:40px;border-radius:20px;background:var(--c);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;object-fit:cover}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:236px;scroll-snap-align:start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:12px;font:inherit;color:inherit;cursor:pointer;transition:transform .2s,border-color .2s;animation:slidein .6s cubic-bezier(.2,.8,.2,1) backwards}
.mini:nth-child(2){animation-delay:.08s}.mini:nth-child(3){animation-delay:.16s}.mini:nth-child(n+4){animation-delay:.24s}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
.mini:active{transform:scale(.97)} .mini.in{border-color:var(--c);box-shadow:0 0 0 3px var(--soft)}
.mini .ph{width:56px;height:76px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--c2);font-size:22px}
.mini .tx{display:flex;flex-direction:column;gap:3px;min-width:0} .mini b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .mini .mut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fab{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:7;display:none;gap:10px}
.fb{flex:1;min-height:58px;padding:8px 12px;border:0;border-radius:29px;background:var(--c);color:#fff;font:800 14px/1.15 'Plus Jakarta Sans',sans-serif;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(54,128,247,.45);cursor:pointer}
.fb.wa{background:#15803D;box-shadow:0 10px 28px rgba(21,128,61,.4)}
.fb:active{transform:scale(.95)}
.pn .mini{width:100%;animation:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
input[type=text],input[type=number],select{min-height:48px;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:500 16px 'Plus Jakarta Sans',sans-serif;color:var(--ink);background:#fff}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;text-align:left} .chk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--c)}
.map{height:220px;border-radius:16px;overflow:hidden;isolation:isolate;border:1px solid var(--line);background:var(--soft)}
#sheet{position:absolute;inset:0;z-index:9;visibility:hidden;pointer-events:none;transition:visibility 0s linear .3s}
#sheet.on{visibility:visible;pointer-events:auto;transition:none}
#sheet .bk{position:absolute;inset:0;background:rgba(11,20,38,.55);opacity:0;transition:opacity .3s} #sheet.on .bk{opacity:1}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
#sheet.on .pn{transform:none} .pn::before{content:"";align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line);flex:none}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;flex:none;font-size:12px;font-weight:600;text-align:center}
.mb img,.mb .ph{width:84px;height:112px;border-radius:14px;object-fit:cover;background:var(--soft)} .mb .ph{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--c2)}
.mbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.body{width:120px;height:160px;border-radius:18px;object-fit:cover;background:var(--soft);border:2px dashed var(--c);flex:none}
.mi{display:flex;align-items:center;width:100%;min-height:52px;border:0;background:none;border-radius:12px;padding:0 12px;font:600 16px 'Plus Jakarta Sans',sans-serif;color:var(--ink);text-align:left;cursor:pointer}
#toast{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 94px);background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;transform:translateY(30px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);z-index:12}
#toast.on{transform:none;opacity:1}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ban{margin:calc(-24px - env(safe-area-inset-top)) -20px 0;width:calc(100% + 40px);overflow:hidden;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(54,128,247,.22)}
.ban img{display:block;width:100%;height:auto;animation:kb 1.6s cubic-bezier(.2,.8,.2,1) both} .still .ban img{animation:none}
@keyframes kb{from{transform:scale(1.14);opacity:0}to{transform:none;opacity:1}}
#sheet.modal .pn{top:50%;left:14px;right:14px;bottom:auto;max-height:92%;border-radius:26px;background:#fff;opacity:0;transform:translateY(-46%) scale(.92);transition:transform .35s cubic-bezier(.3,1.3,.5,1),opacity .25s}
#sheet.modal.on .pn{opacity:1;transform:translateY(-50%) scale(1)} #sheet.modal .pn::before{display:none}
.lbl{font-size:14px;font-weight:700}
.gb{position:absolute;right:-6px;bottom:-6px;width:26px;height:26px;border-radius:13px;border:2px solid #fff;object-fit:cover;background:var(--soft)}
#menuBtn img{display:block}
.tms{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none} .tms::-webkit-scrollbar{display:none}
.tm{flex:none;min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:700 14px 'Plus Jakarta Sans',sans-serif;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.tm.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.05)} .tms.eq .tm{flex:1;padding:0}
#qmap{height:170px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"><header id="hdr"><button id="menuBtn" data-act="menu" aria-label="Abrir menú"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header>
<main class="screen" id="screen"></main>
<div id="fab"><button class="fb" data-act="sop">Sumarme o proponer</button><a class="fb wa" href="https://chat.whatsapp.com/KwnHmDom83B3jNkP06dlm8?s=cl&amp;p=i&amp;iam=2" target="_blank" rel="noopener">Sumarme al grupo de WhatsApp</a></div>
<div id="sheet"></div><div id="toast" role="status"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIG ============ */
const SUPABASE_URL='https://brlhcorgjnaipmokhmhj.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJybGhjb3Jnam5haXBtb2tobWhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MzAyMzgsImV4cCI6MjExMDIwNjIzOH0.49WI6fH9wxiYNgXo5jjaa4VwfvPOjx5Y_NLlIgx06v8';
const TZ='America/Argentina/Buenos_Aires',DEF_POS=[-34.5745,-58.4150];
const PPM=100,META=100000; /* pasos estimados por minuto · meta semanal por defecto */
const sb=window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=(s,e=document)=>e.querySelector(s);
const fmt=n=>Math.round(+n).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const hora=iso=>new Date(iso).toLocaleTimeString('es-AR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
const fecha=iso=>cap(new Date(iso).toLocaleDateString('es-AR',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'}));
const hoyAR=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const lunes=()=>{const d=new Date(hoyAR()+'T12:00:00');return addD(hoyAR(),-((d.getDay()+6)%7))};
const diaDe=iso=>{const d=new Date(iso).toLocaleDateString('en-CA',{timeZone:TZ});return d===hoyAR()?'Hoy':d===addD(hoyAR(),1)?'Mañana':cap(new Date(iso).toLocaleDateString('es-AR',{timeZone:TZ,weekday:'short',day:'numeric'}))};
const cuando=c=>{const m=Math.round((new Date(c.inicia_at)-Date.now())/60000);return m<=0?'En curso':m<60?'En '+m+' min':diaDe(c.inicia_at)+' '+hora(c.inicia_at)};
const mapsLink=(a,b)=>`https://www.google.com/maps/dir/?api=1&destination=${a},${b}`;
const gotLs=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const HAM='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
let S={min:[],ca:[]},view='login',PQ=null,PQM=null,LP=null;
const REG=new Set();

/* ============ DATOS ============ */
const perfilOk=()=>!!(S.p&&S.p.edad>=18&&S.p.foto_cuerpo_url);
async function load(){
 const uid=S.uid,now=new Date().toISOString();
 const [p,ca,logs,wf,nu]=await Promise.all([
  q(sb.from('profiles').select('*').eq('id',uid).single()),
  q(sb.rpc('caminatas_activas')),
  q(sb.from('minutos_log').select('dia,minutos').eq('user_id',uid).gte('dia',lunes())),
  q(sb.from('walks').select('*').eq('estado','publicada').gte('inicia_at',now).order('inicia_at').limit(1)),
  sb.rpc('usuarios_nuevos').then(r=>r.data||[],()=>[])]);
 S.p=p;S.ca=ca||[];S.min=logs||[];S.w=wf[0]||null;S.ocu=0;S.yo=false;S.nu=nu;
 const hechas=S.ca.filter(c=>(c.estoy||c.es_mio)&&c.miembros.length>1&&new Date(c.inicia_at)<=new Date()&&!REG.has(c.id));
 if(hechas.length){try{await Promise.all(hechas.map(c=>{REG.add(c.id);return sb.rpc('registrar_caminata',{p_id:c.id})}));S.min=await q(sb.from('minutos_log').select('dia,minutos').eq('user_id',uid).gte('dia',lunes()))}catch(e){console.warn(e)}}
 const gf=gphoto();
 if(!S.p.foto_url&&gf){S.p.foto_url=gf;try{await q(sb.from('profiles').update({foto_url:gf}).eq('id',uid))}catch(e){console.warn(e)}}
 if(!S.p.acepto_terminos_at&&gotLs('consent')==='1'){const t=new Date().toISOString();
  await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:t}).eq('id',uid));S.p.acepto_terminos_at=t;try{localStorage.removeItem('consent')}catch(e){}}
 if(S.w){const[st,sg]=await Promise.all([q(sb.from('walk_stats').select('*').eq('walk_id',S.w.id).maybeSingle()),q(sb.from('walk_signups').select('estado').eq('walk_id',S.w.id).eq('user_id',uid).maybeSingle())]);
  S.ocu=st?st.ocupados:0;S.yo=!!sg&&sg.estado!=='cancelado'}}
const gphoto=()=>{const m=S.meta||{},i=(S.ids||[]).find(x=>x.provider==='google'),d=(i&&i.identity_data)||{},u=m.avatar_url||m.picture||d.avatar_url||d.picture||'';return u.replace(/=s\d+-c$/,'=s256-c')};
const minTot=()=>S.min.reduce((a,b)=>a+b.minutos,0);
const minHoy=()=>S.min.filter(x=>x.dia===hoyAR()).reduce((a,b)=>a+b.minutos,0);
const sig=()=>JSON.stringify([S.ca,S.min,S.ocu,S.yo,S.w&&S.w.id,S.nu&&S.nu.length]);

/* ============ VISTAS ============ */
const fig=(u,n,cls='ph')=>u?`<img class="${cls}" src="${esc(u)}" referrerpolicy="no-referrer" alt="${esc(n)}">`:`<div class="${cls}">${esc((n||'?')[0])}</div>`;
const mini=c=>`<button class="mini${c.estoy?' in':''}" data-act="open" data-id="${c.id}"><div style="position:relative;flex:none">${fig(c.foto_cuerpo_url||c.foto_url,c.nombre)}${c.foto_cuerpo_url&&c.foto_url?`<img class="gb" src="${esc(c.foto_url)}" referrerpolicy="no-referrer" alt="">`:''}</div><div class="tx"><span class="chip${new Date(c.inicia_at)<=new Date()?' live':''}" style="align-self:flex-start">${cuando(c)}</span><b>${esc(c.nombre)} ${esc(c.inicial)}., ${c.edad}</b><span class="mut">${esc(c.punto)}</span><span class="mut">${c.miembros.length} de ${c.cupo_max} van${c.estoy?' · estás dentro':''}</span></div></button>`;
const gate=(act,label)=>`<div class="col" style="min-height:100%;text-align:center;align-items:center;padding-top:24px"><div class="ban"><img src="encabezado.jpg" alt="Pateando" width="1200" height="400"></div><h1 class="rise" style="font-size:27px">Caminá 15 minutos<br>con alguien cerca.</h1><p class="rise mut" style="font-size:15px">Mirá quién sale a caminar entre las 18 y las 22, sumate o proponé tu caminata. Cuando juntes pasos, desbloqueás la caminata grupal del finde.</p><div class="g12 rise" style="width:100%;margin-top:auto"><label class="chk"><input type="checkbox" id="ok18"><span>Tengo 18 años o más y acepto los <a href="#" data-act="terms">Términos y el descargo de responsabilidad</a>.</span></label><button class="btn" id="go" disabled data-act="${act}">${label}</button>${act==='accept'?'<button class="link" data-act="logout" style="align-self:center">Cerrar sesión</button>':''}</div></div>`;
function groupCard(){const w=S.w;if(!w)return `<div class="card rise"><h2>Caminata grupal</h2><p class="mut">Todavía no hay una caminata grupal publicada. Volvé pronto.</p></div>`;
 const pasos=minTot()*PPM,meta=w.meta_pasos||META,u=pasos>=meta,libres=Math.max(0,w.cupo_max-S.ocu);
 const btn=S.yo?`<button class="btn out pop" data-act="wleave">✓ Estás anotado · Me bajo</button>`:!u?`<button class="btn" disabled>Se desbloquea con ${fmt(meta)} pasos</button>`:libres?`<button class="btn" data-act="wjoin">Anotarme a la caminata</button>`:`<button class="btn" disabled>Cupo completo</button>`;
 return `<div class="card g12 rise"><div><p class="mut">Caminata grupal</p><p style="font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px">${fecha(w.inicia_at)}, ${hora(w.inicia_at)}</p><p style="font-size:14px;margin-top:4px">${esc(w.lugar)}${w.punto_encuentro?' · '+esc(w.punto_encuentro):''}</p>${w.punto_lat!=null?`<a href="${mapsLink(w.punto_lat,w.punto_lng)}" target="_blank" rel="noopener" style="font-size:14px">Cómo llegar</a>`:''}</div><p style="font-size:14px">${esc(w.titulo)}. ${esc(w.incluye||'')}</p>
<div class="bar"><i data-w="${Math.min(100,pasos/meta*100)}"></i></div><p style="font-size:14px;font-weight:600;color:var(--c2)">${u?'¡Meta cumplida! Ya podés anotarte.':`Te faltan ${fmt(meta-pasos)} pasos para desbloquearla`}</p><p class="mut">${S.ocu} de ${w.cupo_max} lugares ocupados</p>${btn}${w.sponsor?`<p class="mut" style="text-align:center">Con el apoyo de ${esc(w.sponsor)}</p>`:''}</div>`}
const nuevos=()=>S.nu&&S.nu.length?`<div class="rise"><h2>Nuevos en Paseando</h2><div class="mbs">${S.nu.map(u=>`<div class="mb">${fig(u.foto_cuerpo_url||u.foto_url,u.nombre,'ph')}<span>${esc(u.nombre)} ${esc(u.inicial)}., ${u.edad}</span></div>`).join('')}</div></div>`:'';
const V={
login:()=>gate('login','Continuar con Google'),
consent:()=>gate('accept','Aceptar y continuar'),
home:()=>{const pasos=minTot()*PPM,meta=(S.w&&S.w.meta_pasos)||META;
 return `<div class="col"><div class="ban"><img src="encabezado.jpg" alt="Pateando" width="1200" height="400"></div><div class="rise row">${fig(S.p.foto_url,S.p.nombre,'av')}<div><p class="mut">Hola, ${esc(S.p.nombre)}</p><h1>¿Quién camina hoy?</h1></div></div>${nuevos()}
<div><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Caminatas activas</h2><span class="chip">18 a 22 h</span></div>${S.ca.length?`<div class="strip">${S.ca.map(mini).join('')}</div>`:`<div class="card rise"><p class="mut">No hay caminatas activas ahora. Tocá <b>Sumarme o proponer</b> y proponé la primera.</p></div>`}</div>
<div class="card g12 rise"><h2 style="margin:0">Tu tiempo caminado</h2><div><span class="big" data-count="${pasos}">0</span> <span class="mut">pasos estimados esta semana</span></div><div class="bar"><i data-w="${Math.min(100,pasos/meta*100)}"></i></div><p class="mut">${minTot()} min esta semana · se suman solos al caminar con alguien (15 min × ${PPM} pasos)</p>
<p class="mut" style="font-size:12px">¡Muy pronto vas a poder registrar todos tus pasos!</p></div>
${groupCard()}<button class="link" data-act="logout" style="align-self:center">Cerrar sesión</button></div>`},
terms:()=>`<div class="col"><div><button class="link" data-act="back">← Volver</button><h1>Términos y descargo</h1></div>${[['Edad','Solo participan personas de 18 años o más.'],['Participación voluntaria','Caminar al aire libre implica riesgos. Participás bajo tu propia responsabilidad.'],['Caminatas de 15 minutos','Paseando conecta personas que deciden caminar juntas y no verifica a nadie. Encontrate siempre en un lugar público y concurrido, avisale a alguien dónde vas y retirate si algo no te parece bien.'],['Fotos y datos','Quienes ven tu caminata ven tu foto de cuerpo entero, nombre, inicial del apellido y edad, para saber con quién se encuentran. Si tu perfil está completo, también aparecés en la lista de nuevos usuarios que ven los demás. El punto del mapa es público para las caminatas activas. Tus datos se tratan según la Ley 25.326 y podés pedir su baja.'],['Responsabilidad','El organizador no responde por lesiones, pérdidas ni por lo que ocurra entre personas que se encuentran a través de la app, en la medida en que la ley lo permita.'],['Conducta','Se espera respeto. Podemos retirar a quien no lo cumpla.']].map(t=>`<div><h2 style="font-size:16px;margin-bottom:4px">${t[0]}</h2><p style="font-size:14px;color:#2B3A55">${t[1]}</p></div>`).join('')}</div>`};

/* ============ SHEETS ============ */
function sheet(h,modal){const s=$('#sheet');s.classList.toggle('modal',!!modal);s.innerHTML=`<div class="bk" data-act="close"></div><div class="pn" role="dialog" aria-modal="true">${h}</div>`;s.classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');PQ=null;PQM=null;S.open=null}
function openDetail(id){const c=S.ca.find(x=>x.id===id);if(!c){closeSheet();return}S.open=id;
 const libres=c.cupo_max-c.miembros.length;
 const btn=c.es_mio?`<button class="btn dan" data-act="leave" data-id="${id}">Cancelar mi caminata</button>`:c.estoy?`<button class="btn out pop" data-act="leave" data-id="${id}">✓ Estás dentro · Me bajo</button>`:libres<=0?'<button class="btn" disabled>Caminata completa</button>':`<button class="btn" data-act="join" data-id="${id}">Me sumo</button>`;
 sheet(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Caminata de 15 minutos</h2><span class="chip${new Date(c.inicia_at)<=new Date()?' live':''}">${cuando(c)}</span></div>
<p style="font-size:14px"><b>${diaDe(c.inicia_at)}, ${hora(c.inicia_at)}</b> · Punto: ${esc(c.punto)}</p><div id="dmap" class="map"></div><a href="${mapsLink(c.lat,c.lng)}" target="_blank" rel="noopener" style="font-size:14px">Cómo llegar</a>
<div><p class="mut" style="margin-bottom:8px">Quiénes van (${c.miembros.length} de ${c.cupo_max})</p><div class="mbs">${c.miembros.map(m=>`<div class="mb">${fig(m.foto_cuerpo_url||m.foto_url,m.nombre,'ph')}<span>${esc(m.nombre)} ${esc(m.inicial)}.${m.id===S.uid?' (vos)':''}</span></div>`).join('')}${Array.from({length:Math.max(0,libres)},()=>'<div class="mb"><div class="ph" style="border:2px dashed var(--c)"></div><span class="mut">Lugar libre</span></div>').join('')}</div></div>${btn}<button class="link" data-act="close" style="text-align:center">Cerrar</button>`);
 loadLeaflet().then(()=>{if(!$('#dmap')||S.open!==id)return;const m=mkMap('dmap',c.lat,c.lng,16);L.marker([c.lat,c.lng]).addTo(m)}).catch(()=>{})}
function perfilSheet(){sheet(`<h2 style="margin:0">Tu perfil para caminar</h2><p style="font-size:14px">Para proponer o sumarte, la otra gente tiene que saber con quién se encuentra: subí una foto de cuerpo entero y tu edad.</p>
<div class="row"><img id="cimg" class="body" ${S.p.foto_cuerpo_url?`src="${esc(S.p.foto_cuerpo_url)}"`:''} alt="Foto de cuerpo entero"><label class="btn sm out" style="width:auto;padding:0 16px;cursor:pointer">${S.p.foto_cuerpo_url?'Cambiar foto':'Subir foto de cuerpo entero'}<input type="file" id="pf" accept="image/*" hidden></label></div>
<label class="f">Edad<input type="number" id="pe" min="18" max="99" value="${S.p.edad||''}" placeholder="Tu edad" inputmode="numeric"></label><button class="btn" data-act="savepf">Guardar</button><button class="link" data-act="close" style="text-align:center">Cancelar</button>`)}
const PX='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function slots(day){const out=[],now=Date.now();for(let h=18;h<22;h++)for(let m=0;m<60;m+=15){const t=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');if(new Date(`${day}T${t}:00-03:00`).getTime()>now+2*60000)out.push(t)}return out}
function qTimes(){const s=slots(S.qd);if(!s.includes(S.qt))S.qt=s[0]||'';
 $('#qt').innerHTML=s.length?s.map(t=>`<button class="tm${t===S.qt?' on':''}" data-act="qtime" data-v="${t}">${t}</button>`).join(''):'<p class="mut">Ya pasó el horario de hoy. Elegí mañana.</p>';
 document.querySelectorAll('#qd .tm').forEach(b=>b.classList.toggle('on',b.dataset.v===S.qd))}
function qInfo(){const n=$('#qinfo');if(n)n.textContent=PQ?(S.qpunto?'Punto: '+S.qpunto+' · ':'Pin marcado · ')+'arrastralo para ajustar':'Tocá el mapa para marcar dónde se encuentran.'}
async function qGeo(a,b){const k=++S.gk;S.qpunto='';qInfo();
 try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&addressdetails=1&accept-language=es&lat=${a}&lon=${b}`),j=await r.json(),ad=j.address||{};
  const n=[ad.road||ad.pedestrian||ad.footway||ad.path||j.name,ad.house_number].filter(Boolean).join(' ');if(k===S.gk){S.qpunto=n;qInfo()}}catch(e){}}
function newSheet(){const h=hoyAR();S.qd=slots(h).length?h:addD(h,1);S.qt='';S.qp=2;S.qpunto='';S.gk=0;PQ=null;
 sheet(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Proponer caminata</h2><span class="chip">15 min</span></div>
<div class="g12"><span class="lbl">Dónde</span><div id="qmap" class="map"></div><div class="row" style="justify-content:space-between;gap:8px"><p class="mut" id="qinfo" style="flex:1"></p><button class="btn sm out" style="width:auto;padding:0 12px" data-act="qmyloc">Mi ubicación</button></div></div>
<div class="g12"><span class="lbl">Cuándo (de 18 a 22 h)</span><div class="tms" id="qd"><button class="tm" data-act="qday" data-v="${h}">Hoy</button><button class="tm" data-act="qday" data-v="${addD(h,1)}">Mañana</button></div><div class="tms" id="qt"></div></div>
<div class="g12"><span class="lbl">Personas más que pueden sumarse</span><div class="tms eq" id="qp">${[1,2,3,4,5].map(n=>`<button class="tm${n===1?' on':''}" data-act="qpp" data-v="${n+1}">${n}</button>`).join('')}</div></div>
<div class="g12"><span class="lbl">Tu foto de cuerpo entero</span><div class="row"><img id="cimg" class="body" style="width:68px;height:90px;border-radius:14px" src="${esc(S.p.foto_cuerpo_url||PX)}" alt="Foto de cuerpo entero"><div class="g12" style="flex:1"><label class="btn sm out" style="cursor:pointer">${S.p.foto_cuerpo_url?'Cambiar foto':'Subir foto'}<input type="file" id="pf" accept="image/*" hidden></label>${S.p.edad>=18?'':'<input type="number" id="pe" min="18" max="99" placeholder="Tu edad (+18)" inputmode="numeric">'}</div></div></div>
<button class="btn" data-act="pubc">Publicar caminata</button><button class="link" data-act="close" style="text-align:center">Cancelar</button>`,true);
 qTimes();
 loadLeaflet().then(()=>{if(!$('#qmap'))return;const m=mkMap('qmap',DEF_POS[0],DEF_POS[1],15);let mk=null;
  const put=(a,b)=>{PQ={lat:a,lng:b};if(mk)mk.setLatLng([a,b]);else{mk=L.marker([a,b],{draggable:true}).addTo(m);mk.on('dragend',()=>{const p=mk.getLatLng();PQ={lat:p.lat,lng:p.lng};qGeo(p.lat,p.lng)})}qGeo(a,b)};
  m.on('click',ev=>put(ev.latlng.lat,ev.latlng.lng));qInfo();PQM={m,put}}).catch(()=>{const el=$('#qmap');if(el)el.innerHTML='<p class="mut" style="padding:16px">No se pudo cargar el mapa.</p>'})}
function menuSheet(){const p=S.p||{};sheet(`<div class="row">${fig(p.foto_url,p.nombre,'av')}<div style="min-width:0"><b>${esc(p.nombre)} ${esc(p.apellido||'')}</b><p class="mut" style="overflow:hidden;text-overflow:ellipsis">${esc(p.email||'')}</p></div></div><button class="mi" data-act="perfil">Mi foto y mi edad</button><button class="mi" data-act="terms">Términos</button><button class="btn out" data-act="logout">Cerrar sesión</button>`)}
function sopSheet(){sheet(`<h2 style="margin:0">Sumarme o proponer</h2>${S.ca.length?`<div class="g12">${S.ca.map(mini).join('')}</div>`:'<p class="mut">No hay caminatas activas ahora.</p>'}<button class="btn" data-act="newc">Proponer mi caminata</button><button class="link" data-act="close" style="text-align:center">Cerrar</button>`)}

/* ============ MAPAS ============ */
function mkMap(id,lat,lng,z){const m=L.map(id,{scrollWheelZoom:false}).setView([lat,lng],z);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);setTimeout(()=>m.invalidateSize(),450);return m}
function loadLeaflet(){if(window.L)return Promise.resolve();if(LP)return LP;
 LP=new Promise((ok,no)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);
  const j=document.createElement('script');j.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';j.onload=ok;j.onerror=()=>{LP=null;no(new Error('mapa'))};document.head.appendChild(j)});return LP}

/* ============ FOTOS ============ */
function shrink(f,max=900){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',.85)};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('imagen no válida'))};im.src=u})}
async function subirCuerpo(f){try{toast('Subiendo foto…');const b=await shrink(f),path=S.uid+'/cuerpo-'+Date.now()+'.jpg';
 const up=await sb.storage.from('fotos').upload(path,b,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;
 const url=sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
 await q(sb.from('profiles').update({foto_cuerpo_url:url}).eq('id',S.uid));S.p.foto_cuerpo_url=url;const i=$('#cimg');if(i)i.src=url;toast('Foto guardada')}
 catch(e){console.error(e);toast('No se pudo subir la foto')}}

/* ============ RENDER ============ */
function enhance(el){
 el.querySelectorAll('.rise').forEach((n,i)=>n.style.animationDelay=Math.min(i*80,640)+'ms');
 requestAnimationFrame(()=>requestAnimationFrame(()=>el.querySelectorAll('[data-w]').forEach(n=>n.style.width=n.dataset.w+'%')));
 el.querySelectorAll('[data-count]').forEach(n=>{const to=+n.dataset.count,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1100);n.textContent=fmt(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function mbtn(){const b=$('#menuBtn'),u=S.p&&S.p.foto_url;b.innerHTML=u?`<img src="${esc(u)}" referrerpolicy="no-referrer" alt="Mi cuenta" style="width:38px;height:38px;border-radius:19px;object-fit:cover;border:2px solid #fff">`:HAM}
function render(name,still){view=name;mbtn();const el=$('#screen'),st=el.scrollTop;el.classList.toggle('still',!!still);el.innerHTML=V[name]();enhance(el);
 el.scrollTop=still?st:0;$('#menuBtn').style.display=['login','consent'].includes(name)?'none':'flex';$('#fab').style.display=name==='home'?'flex':'none';
 if(!still)el.animate([{transform:'translateX(24px)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
const need=fn=>{if(!perfilOk()){S.after=fn;perfilSheet();return}fn()};
const ERR={perfil_incompleto:'Completá tu foto de cuerpo entero y tu edad',fuera_de_horario:'Las caminatas son entre las 18 y las 22 h',ya_tenes_caminata:'Ya tenés una caminata activa',completa:'La caminata ya está completa',no_disponible:'Esa caminata ya no está disponible',fecha_invalida:'Elegí un horario válido',limite_diario:'Llegaste al máximo de 10 horas por día'};

/* ============ EVENTOS ============ */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='terms')e.preventDefault();
 try{
 if(a==='menu')menuSheet();
 if(a==='close')closeSheet();
 if(a==='terms'){closeSheet();S.prev=view;render('terms')}
 if(a==='back')render(S.prev&&S.prev!=='terms'?S.prev:'home');
 if(a==='open')openDetail(id);
 if(a==='login'){try{localStorage.setItem('consent','1')}catch(x){}await q(sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}))}
 if(a==='accept'){const ts=new Date().toISOString();await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:ts}).eq('id',S.uid));S.p.acepto_terminos_at=ts;await load();render('home')}
 if(a==='logout'){await sb.auth.signOut();S={min:[],ca:[]};closeSheet();render('login')}
 if(a==='perfil')perfilSheet();
 if(a==='savepf'){const ed=+$('#pe').value;if(!(ed>=18&&ed<=99)){toast('Tenés que tener 18 años o más');return}
  if(!S.p.foto_cuerpo_url){toast('Subí tu foto de cuerpo entero');return}
  t.disabled=true;await q(sb.from('profiles').update({edad:ed}).eq('id',S.uid));S.p.edad=ed;closeSheet();toast('Perfil listo');const f=S.after;S.after=null;if(f)f()}
 if(a==='newc')newSheet();
 if(a==='sop')sopSheet();
 if(a==='qday'){S.qd=t.dataset.v;S.qt='';qTimes()}
 if(a==='qtime'){S.qt=t.dataset.v;document.querySelectorAll('#qt .tm').forEach(b=>b.classList.toggle('on',b.dataset.v===S.qt))}
 if(a==='qpp'){S.qp=+t.dataset.v;document.querySelectorAll('#qp .tm').forEach(b=>b.classList.toggle('on',b===t))}
 if(a==='qmyloc'){if(!navigator.geolocation||!PQM){toast('No pudimos obtener tu ubicación');return}
  navigator.geolocation.getCurrentPosition(p=>{PQM.m.setView([p.coords.latitude,p.coords.longitude],17);PQM.put(p.coords.latitude,p.coords.longitude)},()=>toast('No pudimos obtener tu ubicación'),{enableHighAccuracy:true,timeout:10000})}
 if(a==='pubc'){if(!PQ){toast('Marcá el pin en el mapa');return}if(!S.qt){toast('Elegí un horario');return}
  if(!S.p.foto_cuerpo_url){toast('Subí tu foto de cuerpo entero');return}
  let ed=S.p.edad;if(!(ed>=18)){ed=+($('#pe')&&$('#pe').value);if(!(ed>=18&&ed<=99)){toast('Tenés que tener 18 años o más');return}}
  t.disabled=true;if(ed!==S.p.edad){await q(sb.from('profiles').update({edad:ed}).eq('id',S.uid));S.p.edad=ed}
  await q(sb.rpc('crear_caminata',{p_lat:PQ.lat,p_lng:PQ.lng,p_punto:S.qpunto||'Punto marcado en el mapa',p_inicia:new Date(`${S.qd}T${S.qt}:00-03:00`).toISOString(),p_cupo:S.qp}));
  await load();closeSheet();render('home',true);toast('¡Caminata publicada!')}
 if(a==='join')need(async()=>{await q(sb.rpc('sumarme_caminata',{p_id:id}));await load();render('home',true);openDetail(id);toast('¡Te sumaste!')});
 if(a==='leave'){const c=S.ca.find(x=>x.id===id);if(c&&c.es_mio&&!confirm('Si cancelás tu caminata, se cancela para todos. ¿Seguro?'))return;
  t.disabled=true;const r=await q(sb.rpc('bajarme_caminata',{p_id:id}));await load();render('home',true);if(r==='cancelada'){closeSheet();toast('Caminata cancelada')}else{openDetail(id);toast('Te bajaste de la caminata')}}
 if(a==='wjoin'){t.disabled=true;const r=await q(sb.rpc('join_walk',{p_walk:S.w.id}));await load();render('home',true);toast(r==='completa'?'Se completó el cupo':'¡Te anotaste a la caminata grupal!')}
 if(a==='wleave'){t.disabled=true;await q(sb.rpc('salir_walk',{p_walk:S.w.id}));await load();render('home',true);toast('Te bajaste de la caminata grupal')}
 }catch(err){const m=err&&err.message||'';const k=Object.keys(ERR).find(x=>m.includes(x));toast(k?ERR[k]:m||'Ocurrió un error');t.disabled=false}
});
document.addEventListener('input',e=>{if(e.target.id==='ok18')$('#go').disabled=!e.target.checked});
document.addEventListener('change',e=>{if(e.target.id==='pf'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)subirCuerpo(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ============ INICIO ============ */
async function boot(){
 if(!sb){$('#screen').innerHTML='<div class="card" style="margin-top:40px"><h2>Falta configurar Supabase</h2></div>';return}
 const{data:{session}}=await sb.auth.getSession();
 if(!session){render('login');return}
 S.uid=session.user.id;S.meta=session.user.user_metadata||{};S.ids=session.user.identities||[];
 try{await load();render(S.p.acepto_terminos_at?'home':'consent')}catch(e){toast(e.message||'No se pudo cargar');render('login')}}
/* Actualiza caminatas activas cada 15 s (si no hay ventana abierta) */
setInterval(async()=>{if(document.hidden||!S.uid||view!=='home'||$('#sheet').classList.contains('on'))return;
 const b=sig();try{await load();if(sig()!==b)render('home',true)}catch(e){}},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.uid&&view==='home'&&!$('#sheet').classList.contains('on'))load().then(()=>render('home',true)).catch(()=>{})});
boot();
</script>
</body>
</html>
