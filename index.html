<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8FCE58">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://brlhcorgjnaipmokhmhj.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Pateando</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--c:#8FCE58;--c2:#3F7A14;--on:#10260A;--ink:#222;--mut:#6A6A6A;--line:#DDD;--soft:#F2F2F2;--sh:0 6px 20px rgba(0,0,0,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F7F7F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:#fff;overflow:hidden}
#menuBtn{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:46px;height:46px;border:0;border-radius:23px;background:rgba(34,34,34,.45);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:8}
.screen{position:absolute;inset:0;overflow-y:auto;background:#fff;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 120px)}
.screen.chatv{padding:0;display:flex;flex-direction:column;overflow:hidden}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.03em} h2{margin:0 0 10px;font-size:18px;font-weight:700}
p{margin:0;line-height:1.5} a{color:var(--c2);font-weight:700} .mut{color:var(--mut);font-size:14px}
.col{display:flex;flex-direction:column;gap:16px} .g12{display:flex;flex-direction:column;gap:12px} .row{display:flex;align-items:center;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
.ban{position:relative;bottom:11px;margin:calc(-24px - env(safe-area-inset-top)) -20px 0;width:calc(100% + 40px);overflow:hidden;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(143,206,88,.35)}
.ban img{display:block;width:100%;height:auto;object-fit:cover}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:999px;background:linear-gradient(90deg,#9BDB63,#85C94C);color:var(--on);font:800 16px 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)} .btn:disabled{background:var(--soft);color:#9A9A9A;cursor:default;transform:none}
.link{background:none;border:0;padding:8px 0;font:700 14px 'Plus Jakarta Sans',sans-serif;color:var(--mut);text-decoration:underline;cursor:pointer;align-self:center}
.info{display:flex;align-items:center;gap:16px;background:#fff;border-radius:20px;padding:16px 18px;box-shadow:var(--sh);font-weight:700;font-size:15px;line-height:1.3}
.tip{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:7;display:none;align-items:center;gap:10px;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none}
.tip b{display:block;font-size:14px;line-height:1.25}.tip small{display:block;font-size:12px;line-height:1.25;color:var(--mut)}
.grey{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;text-align:center}
.lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;text-align:left} .chk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--c2)}
.pc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid #EBEBEB;border-radius:20px;padding:10px;box-shadow:0 4px 14px rgba(0,0,0,.07);font:inherit;color:inherit;cursor:pointer;transition:transform .15s}
.pc:active{transform:scale(.98)} .pc:disabled{opacity:.6;cursor:default;transform:none}
.pc .pp{width:76px;height:88px;border-radius:14px;object-fit:cover;background:var(--soft);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--c2)}
.pc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px} .pc b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;background:var(--c);color:var(--on);font-weight:800;font-size:14px;border-radius:999px;padding:11px 18px}
.go.off{background:var(--soft);color:var(--mut)}
.pc.me{cursor:default;border-color:var(--c);box-shadow:0 0 0 2px #E3F4D2}
.onl{display:flex;align-items:center;gap:6px;flex:none;font-size:13px;font-weight:800;color:var(--c2)}
.onl i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sk{border-radius:20px;height:108px;background:linear-gradient(90deg,#F2F2F2,#FAFAFA,#F2F2F2);background-size:200% 100%;animation:shim 1.3s infinite} @keyframes shim{to{background-position:-200% 0}}
.av{width:44px;height:44px;border-radius:22px;background:var(--c);color:var(--on);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;object-fit:cover}
.slot{display:flex;align-items:center;justify-content:center;width:62%;aspect-ratio:3/4;margin:0 auto;border:2px dashed var(--c2);border-radius:22px;font-size:44px;color:var(--c2);cursor:pointer;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover}
/* burbujas flotantes */
#bub{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:7;display:flex;gap:12px;flex-direction:row-reverse}
.bb{position:relative;width:64px;height:64px;padding:0;border:3px solid #fff;border-radius:50%;background:var(--c);box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.bb .bi{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:var(--on)}
.bd{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--ink);color:#fff;font:800 13px/24px 'Plus Jakarta Sans',sans-serif;text-align:center;border:2px solid #fff}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.pts{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);height:46px;display:none;align-items:center;gap:8px;padding:0 16px 0 12px;border-radius:23px;background:rgba(34,34,34,.55);color:#fff;font-size:14px;font-weight:600;z-index:8}
.pts b{font-size:18px;font-weight:800}
.wa{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:#fff;border:1px solid #EBEBEB;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:7}
.wa:active{transform:translateX(-50%) scale(.94)}
/* chat */
.chh{flex:none;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.06);z-index:2}
.chh .row{padding-bottom:12px} .chh b{font-size:16px}
.cdl{height:6px;margin:0 -16px;background:var(--soft)} .cdl i{display:block;height:100%;width:100%;background:var(--c);border-radius:0 3px 3px 0;transition:width 1s linear}
#msgs{flex:1;overflow-y:auto;padding:16px 16px 190px;display:flex;flex-direction:column;gap:8px}
.m{align-self:flex-start;max-width:78%;background:var(--soft);padding:11px 15px;border-radius:20px 20px 20px 6px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--c);color:var(--on);border-radius:20px 20px 6px 20px;font-weight:600}
.cin{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);background:#fff;border-top:1px solid #EBEBEB}
.cin input{flex:1;min-width:0;height:52px;border:1px solid #888;border-radius:999px;padding:0 20px;font:500 16px 'Plus Jakarta Sans',sans-serif;color:var(--ink);background:#fff}
.cin input:disabled{background:var(--soft);border-color:var(--line)}
.snd{flex:none;width:52px;height:52px;border:0;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;cursor:pointer}
.snd:disabled{background:var(--soft)}
.back{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:5;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 20px 0 14px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:800 15px 'Plus Jakarta Sans',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer}
.end{margin:6px 16px 0;text-align:center}
/* menú */
#sheet{position:absolute;inset:0;z-index:9;visibility:hidden;pointer-events:none;transition:visibility 0s linear .3s}
#sheet.on{visibility:visible;pointer-events:auto;transition:none}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s} #sheet.on .bk{opacity:1}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:14px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:6px}
#sheet.on .pn{transform:none}
.mi{display:flex;align-items:center;width:100%;min-height:54px;border:0;border-bottom:1px solid #EBEBEB;background:none;padding:0 4px;font:600 16px 'Plus Jakarta Sans',sans-serif;color:var(--ink);text-align:left;cursor:pointer}
.mi.dan{color:#C13515;border-bottom:0}
#toast{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 100px);background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;transform:translateY(30px);opacity:0;pointer-events:none;transition:.35s;z-index:12}
#toast.on{transform:none;opacity:1}
input:focus-visible,button:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
<button id="menuBtn" data-act="menu" aria-label="Abrir menú"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div id="pts" class="pts" aria-live="polite"></div>
<div id="tip" class="tip" role="status"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><path d="M6 3h12l4 6-10 12L2 9z" fill="#8FCE58"/><path d="M2 9h20M9 3l-2 6 5 12M15 3l2 6-5 12" stroke="#fff" stroke-width="1" fill="none"/></svg><div><b id="cnt">Buscando gente cerca…</b><small>Chats de 15 min · hasta 2 a la vez</small></div></div>
<main class="screen" id="screen"></main>
<a id="wa" class="wa" href="#" target="_blank" rel="noopener" aria-label="Compartir Pateando por WhatsApp"><svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><path fill="#1FA855" d="M16 3a13 13 0 0 0-11 19.8L3 29l6.4-1.7A13 13 0 1 0 16 3zm0 2.4a10.6 10.6 0 1 1-5.4 19.7l-.4-.2-3.800 1 1-3.700-.3-.4A10.600 10.600 0 0 1 16 5.400zm-4.100 5.300c-.3 0-.7.100-1 .5-.4.400-1.300 1.300-1.300 3.100s1.300 3.600 1.500 3.800c.2.300 2.600 4.100 6.400 5.600 3.100 1.200 3.700 1 4.400.9.700-.1 2.200-.9 2.500-1.800.3-.9.300-1.600.2-1.800-.1-.2-.4-.3-.8-.5s-2.200-1.100-2.500-1.200c-.3-.1-.6-.2-.8.200-.2.400-.9 1.200-1.100 1.400-.2.200-.4.300-.8.100-.4-.2-1.600-.6-3-1.900-1.100-1-1.900-2.300-2.100-2.700-.2-.4 0-.6.200-.8l.6-.7c.2-.2.200-.4.400-.6.100-.3.100-.5 0-.7-.1-.2-.8-2-1.100-2.700-.3-.7-.6-.6-.8-.6z"/></svg></a>
<div id="bub"></div><div id="sheet"></div><div id="toast" role="status"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIG ============ */
const SUPABASE_URL='https://brlhcorgjnaipmokhmhj.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJybGhjb3Jnam5haXBtb2tobWhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MzAyMzgsImV4cCI6MjExMDIwNjIzOH0.49WI6fH9wxiYNgXo5jjaa4VwfvPOjx5Y_NLlIgx06v8';
const CHAT_MS=15*60*1000;
const sb=window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const gotLs=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const km=k=>k<1?'a menos de 1 km':'a '+k.toFixed(1).replace('.',',')+' km';
const ERR={ya_hablaron:'Hoy ya hablaron: no pueden volver a chatear hasta mañana',limite_chats:'Ya estás hablando con 2 personas',otro_ocupado:'Esa persona ya está hablando con 2 personas',expirado:'El tiempo de este chat terminó',sin_foto:'Subí tu foto primero',vacio:'Escribí un mensaje'};
const errMsg=e=>{const m=(e&&e.message)||'',k=Object.keys(ERR).find(x=>m.includes(x));return k?ERR[k]:'Ocurrió un error. Probá de nuevo'};
let S={gente:[],chats:[],off:0,gerr:'',load:true},view='login';

/* ============ UBICACIÓN ============ */
function gps(){return new Promise(ok=>{
 if(!navigator.geolocation){S.gerr='Tu navegador no tiene ubicación.';return ok(false)}
 navigator.geolocation.getCurrentPosition(p=>{S.pos={lat:p.coords.latitude,lng:p.coords.longitude};S.gerr='';ok(true)},
  ()=>{S.gerr='Necesitamos tu ubicación para mostrarte gente cerca. Activala en tu navegador y reintentá.';ok(false)},{timeout:10000,maximumAge:60000})})}
async function ping(){if(!S.pos)return;const r=await sb.rpc('pc_ubicar',{p_lat:S.pos.lat,p_lng:S.pos.lng});S.perr=r.error?r.error.message:''}

/* ============ DATOS ============ */
async function loadP(){
 S.p=await q(sb.from('profiles').select('*').eq('id',S.uid).single());
 if(!S.p.acepto_terminos_at&&gotLs('consent')==='1'){const t=new Date().toISOString();
  await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:t}).eq('id',S.uid));S.p.acepto_terminos_at=t;try{localStorage.removeItem('consent')}catch(e){}}}
async function refChats(){try{const c=await q(sb.rpc('pc_mis_chats'));S.chats=c||[];if(S.chats[0])S.off=Date.parse(S.chats[0].ahora)-Date.now()}catch(e){console.warn(e)}}
async function refGente(){try{S.gente=await q(sb.rpc('pc_gente_cerca',{p_radio:25}))||[];S.ferr=''}catch(e){console.warn(e);S.ferr=e.message||'error'}S.load=false;try{S.pts=await q(sb.rpc('pc_mis_puntos'))}catch(e){console.warn(e)}}

/* ============ VISTAS ============ */
const fig=(u,n,cls)=>u?`<img class="${cls}" src="${esc(u)}" referrerpolicy="no-referrer" alt="${esc(n)}">`:`<div class="${cls}">${esc((n||'?')[0])}</div>`;
const BAN='<div class="ban"><img src="encabezado.jpg" alt="Pateando" width="1200" height="400"></div>';
const gate=(act,label)=>`<div class="col" style="min-height:100%">${BAN}<h1 style="padding-top:24px;font-size:28px">Gente en línea para caminar por tu zona</h1><p class="mut" style="font-size:15px">Mirá quién está cerca, escribile y charlen 15 minutos. Después, cada uno sigue su camino.</p><div class="g12" style="margin-top:auto"><label class="chk"><input type="checkbox" id="ok18"><span>Tengo 18 años o más y acepto los <a href="#" data-act="terms">Términos y el descargo de responsabilidad</a>.</span></label><button class="btn" id="go" disabled data-act="${act}">${label}</button>${act==='accept'?'<button class="link" data-act="logout">Cerrar sesión</button>':''}</div></div>`;
const GEM='<svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z" fill="#8FCE58"/><path d="M2 9h20M9 3l-2 6 5 12M15 3l2 6-5 12" stroke="#fff" stroke-width="1" fill="none"/></svg>';
const card=u=>`<button class="pc" data-act="talk" data-id="${u.id}"${u.ocupado?' disabled':''}>${fig(u.foto,u.nombre,'pp')}<div class="tx"><b>${esc(u.nombre)} ${esc(u.inicial)}.${u.edad?', '+u.edad:''}</b><span class="mut">${km(u.km)}</span></div><span class="go${u.ocupado?' off':''}">${u.ocupado?'Ocupado/a':'Hablar'}</span></button>`;
const V={
login:()=>gate('login','Continuar con Google'),
consent:()=>gate('accept','Aceptar y continuar'),
photo:()=>`<div class="col">${BAN}<h1 style="padding-top:20px">Subí tu foto</h1><p class="mut" style="font-size:15px">Una sola foto donde se te vea bien. Es lo que ve la gente cerca tuyo.</p><label class="slot" id="slot">${S.p.foto_cuerpo_url?`<img src="${esc(S.p.foto_cuerpo_url)}" alt="Tu foto">`:'+'}<input type="file" id="pf" accept="image/*" hidden></label><button class="btn" id="pgo" data-act="pgo"${S.p.foto_cuerpo_url?'':' disabled'}>Continuar</button><button class="link" data-act="logout">Cerrar sesión</button></div>`,
home:()=>`<div class="col">${BAN}<h1 style="padding-top:20px">Gente en línea para caminar por tu zona</h1><div id="gm"></div><span class="lab">En línea ahora</span><div id="lista" class="g12"></div><button class="link" data-act="terms">Términos y descargo</button></div>`,
chat:()=>{const o=S.cur;return `<div class="chh"><div class="row">${fig(o.foto,o.nombre,'av')}<div style="flex:1;min-width:0"><b>${esc(o.nombre)} ${esc(o.inicial)}.</b><div class="mut" id="ctm">${o.chat?'':'El chat dura 15 min desde tu primer mensaje'}</div></div></div><div class="cdl"><i id="cdi"></i></div></div><div id="msgs"></div><button class="back" data-act="home" aria-label="Volver al inicio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Volver</button><div class="cin"><input id="ci" maxlength="500" placeholder="Escribí un mensaje…" autocomplete="off" aria-label="Mensaje"><button class="snd" id="snd" data-act="send" aria-label="Enviar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10260A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`},
terms:()=>`<div class="col"><div><button class="link" data-act="back" style="padding-left:0">← Volver</button><h1>Términos y descargo</h1></div>${[['Edad','Solo participan personas de 18 años o más.'],['Participación voluntaria','Caminar al aire libre implica riesgos. Participás bajo tu propia responsabilidad.'],['Chats de 15 minutos','Pateando muestra gente en línea cerca tuyo y no verifica a nadie. Cada chat dura 15 minutos, podés hablar con 2 personas a la vez y no se puede volver a hablar con la misma persona el mismo día. Si se encuentran, que sea en un lugar público y concurrido; avisale a alguien dónde vas y retirate si algo no te parece bien.'],['Foto y ubicación','La gente cerca tuyo ve tu foto, tu nombre, la inicial de tu apellido y a qué distancia estás. Nunca mostramos tu ubicación exacta. Usamos tu ubicación solo mientras la app está abierta. Tus datos se tratan según la Ley 25.326 y podés borrar tu cuenta cuando quieras desde el menú.'],['Responsabilidad','El organizador no responde por lesiones, pérdidas ni por lo que ocurra entre personas que se encuentran a través de la app, en la medida en que la ley lo permita.'],['Conducta','Se espera respeto. Podemos retirar a quien no lo cumpla.']].map(t=>`<div><h2 style="font-size:16px;margin-bottom:4px">${t[0]}</h2><p style="font-size:14px;color:#484848">${t[1]}</p></div>`).join('')}</div>`};

function render(name){view=name;const el=$('#screen');el.classList.toggle('chatv',name==='chat');el.innerHTML=V[name]();el.scrollTop=0;
 $('#menuBtn').style.display=['home','photo','terms'].includes(name)?'flex':'none';$('#wa').style.display=name==='home'?'flex':'none';$('#tip').style.display=name==='home'?'flex':'none';drawBub()}
const mine=()=>{const p=S.p||{};return `<div class="pc me">${fig(p.foto_cuerpo_url,p.nombre,'pp')}<div class="tx"><b>${esc(p.nombre)} ${esc((p.apellido||'').charAt(0).toUpperCase())}.${p.edad?', '+p.edad:''} (vos)</b><span class="mut">Tu perfil</span></div><span class="onl"><i></i>En línea</span></div>`};
function drawLista(){const e=$('#lista');if(!e)return;const g=S.gente;
 $('#gm').innerHTML=S.gerr?`<div class="card g12"><p>${esc(S.gerr)}</p><button class="btn" data-act="gps">Activar ubicación</button></div>`:'';
 if(S.gerr){e.innerHTML='';$('#cnt').textContent='Sin ubicación no podemos buscar gente';return}
 $('#cnt').textContent=S.load?'Buscando gente cerca…':S.ferr||S.perr?'No pudimos cargar la gente en línea':!g.length?'Sos la primera persona en línea cerca tuyo':g.length+(g.length===1?' persona más en línea cerca tuyo':' personas más en línea cerca tuyo');
 e.innerHTML=mine()+(S.perr?'<div class="card"><p class="mut">No pudimos registrar tu ubicación: '+esc(S.perr)+'</p></div>':'')+(S.load?'<div class="sk"></div><div class="sk"></div>':S.ferr?'<div class="card"><p class="mut">No pudimos cargar a la gente en línea: '+esc(S.ferr)+'</p></div>':g.length?g.map(card).join(''):'<div class="card"><p class="mut">Todavía no hay nadie más en línea cerca. Dejá la app abierta: esta lista se actualiza sola.</p></div>')}
const STAR='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#8FCE58" d="M12 2l3 6.500 7 .8-5.200 4.800 1.400 7L12 17.600 5.800 21l1.400-7L2 9.300l7-.8z"/></svg>';
function drawPts(){const e=$('#pts');e.innerHTML=S.pts!=null?`${STAR}<span><b>${S.pts}</b> puntos</span>`:'';e.style.display=view==='home'&&S.pts!=null?'flex':'none'}
function drawBub(){drawPts();$('#bub').innerHTML=view==='home'?S.chats.map(c=>`<button class="bb" data-act="chat" data-id="${c.id}" aria-label="Chat con ${esc(c.nombre)}${c.sin_leer>0?', '+c.sin_leer+' sin leer':''}">${fig(c.foto,c.nombre,'bi')}${c.sin_leer>0?`<span class="bd">${c.sin_leer}</span>`:''}</button>`).join(''):''}
function sheet(h){const s=$('#sheet');s.innerHTML=`<div class="bk" data-act="close"></div><div class="pn" role="dialog" aria-modal="true">${h}</div>`;s.classList.add('on')}
const closeSheet=()=>$('#sheet').classList.remove('on');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}

/* ============ FOTO ============ */
function shrink(f,max=900){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',.85)};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('imagen'))};im.src=u})}
async function subirFoto(f){try{toast('Subiendo foto…');const b=await shrink(f),path=S.uid+'/foto-'+Date.now()+'.jpg';
 const up=await sb.storage.from('fotos').upload(path,b,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;
 const url=sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
 await q(sb.from('profiles').update({foto_cuerpo_url:url}).eq('id',S.uid));S.p.foto_cuerpo_url=url;
 $('#slot').innerHTML=`<img src="${esc(url)}" alt="Tu foto"><input type="file" id="pf" accept="image/*" hidden>`;$('#pgo').disabled=false;toast('Foto guardada')}
 catch(e){console.error(e);toast('No se pudo subir la foto')}}

/* ============ CHAT ============ */
function openChat(o){S.cur={...o,n:-1,locked:false};render('chat');pollChat();setTimeout(()=>{const i=$('#ci');if(i)i.focus()},300)}
function drawMsgs(l){const e=$('#msgs');if(!e)return;const near=e.scrollHeight-e.scrollTop-e.clientHeight<90;
 e.innerHTML=l.length?l.map(m=>`<div class="m${m.de===S.uid?' me':''}">${esc(m.texto)}</div>`).join(''):'<p class="mut" style="text-align:center;margin-top:20px">Escribí el primer mensaje para empezar.</p>';
 if(near||S.cur.n<0)e.scrollTop=e.scrollHeight}
function lock(){const o=S.cur;if(o.locked)return;o.locked=true;const i=$('#ci');if(i){i.disabled=true;i.placeholder='El chat terminó';$('#snd').disabled=true}
 const m=$('#msgs');if(m&&!$('.end',m)){const d=document.createElement('p');d.className='mut end';d.textContent='Se terminó el tiempo. Hoy no pueden volver a hablar.';m.append(d);m.scrollTop=m.scrollHeight}
 $('#ctm').textContent='Se terminó el tiempo';$('#cdi').style.width='0%'}
async function pollChat(){const o=S.cur;if(view!=='chat'||!o||!o.chat)return;
 try{await refChats();const c=S.chats.find(x=>x.id===o.chat);if(c)o.exp=Date.parse(c.expira_at);
  const l=await q(sb.from('pc_mensajes').select('de,texto').eq('chat_id',o.chat).order('creado_at'));
  if(view!=='chat')return;if(l.length!==o.n){drawMsgs(l);o.n=l.length;if(l.some(m=>m.de!==S.uid))sb.rpc('pc_leer',{p_chat:o.chat}).then(()=>{})}
  if(!c)lock()}catch(e){console.warn(e)}}
function tick(){const o=S.cur;if(view!=='chat'||!o)return;if(!o.exp){const b=$('#cdi');if(b)b.style.width='100%';return}
 const r=Math.max(0,o.exp-(Date.now()+S.off));if(r<=0)return lock();
 const s=Math.ceil(r/1000);$('#cdi').style.width=(r/CHAT_MS*100)+'%';$('#ctm').textContent='Quedan '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
async function send(){const o=S.cur,i=$('#ci'),t=i.value.trim();if(!t||o.locked)return;i.value='';
 try{if(!o.chat){o.chat=await q(sb.rpc('pc_hablar',{p_con:o.otro,p_texto:t}));await refChats();const c=S.chats.find(x=>x.id===o.chat);if(c)o.exp=Date.parse(c.expira_at)}
  else await q(sb.rpc('pc_enviar',{p_chat:o.chat,p_texto:t}));
  await pollChat();tick()}catch(e){i.value=t;toast(errMsg(e));if(String(e.message).includes('expirado'))pollChat()}}
async function goHome(){S.cur=null;S.load=false;render('home');drawLista();await Promise.all([refChats(),refGente()]);drawBub();drawLista()}

/* ============ EVENTOS ============ */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='terms')e.preventDefault();
 try{
 if(a==='menu')sheet(`<button class="mi" data-act="terms">Términos y descargo</button><button class="mi" data-act="logout">Cerrar sesión</button><button class="mi dan" data-act="delete">Borrar cuenta</button>`);
 if(a==='close')closeSheet();
 if(a==='terms'){closeSheet();S.prev=view;render('terms')}
 if(a==='back')S.prev==='photo'||S.prev==='consent'||S.prev==='login'?render(S.prev):goHome();
 if(a==='login'){try{localStorage.setItem('consent','1')}catch(x){}await q(sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}))}
 if(a==='accept'){const ts=new Date().toISOString();await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:ts}).eq('id',S.uid));S.p.acepto_terminos_at=ts;next()}
 if(a==='pgo')next();
 if(a==='logout'){await sb.auth.signOut();S={gente:[],chats:[],off:0,gerr:'',load:true};closeSheet();render('login')}
 if(a==='delete'){if(!confirm('Se borran tu cuenta, tu foto y tus chats. No se puede deshacer. ¿Seguro?'))return;
  await q(sb.rpc('pc_borrar_cuenta'));await sb.auth.signOut();S={gente:[],chats:[],off:0,gerr:'',load:true};closeSheet();render('login');toast('Tu cuenta fue borrada')}
 if(a==='gps'){t.disabled=true;await gps();drawLista();if(S.pos){await ping();await refGente();drawLista()}}
 if(a==='talk'){const u=S.gente.find(x=>x.id===id);if(u)openChat({chat:null,otro:u.id,nombre:u.nombre,inicial:u.inicial,foto:u.foto})}
 if(a==='chat'){const c=S.chats.find(x=>x.id===id);if(c)openChat({chat:c.id,otro:c.otro,nombre:c.nombre,inicial:c.inicial,foto:c.foto,exp:Date.parse(c.expira_at)})}
 if(a==='home')goHome();
 if(a==='send')send();
 }catch(err){toast(errMsg(err));if(t.disabled)t.disabled=false}
});
document.addEventListener('input',e=>{if(e.target.id==='ok18')$('#go').disabled=!e.target.checked});
document.addEventListener('change',e=>{if(e.target.id==='pf'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)subirFoto(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='ci')send()});

/* ============ INICIO ============ */
async function next(){const p=S.p;
 if(!p.acepto_terminos_at)return render('consent');
 if(!p.foto_cuerpo_url)return render('photo');
 S.ready=true;S.load=true;render('home');drawLista();
 await S.gp;drawLista();await ping().catch(()=>{});await Promise.all([refChats(),refGente()]);drawBub();drawLista()}
async function boot(){
 if(!sb){$('#screen').innerHTML='<div class="card"><h2>Falta configurar Supabase</h2></div>';return}
 const{data:{session}}=await sb.auth.getSession();
 if(!session){render('login');return}
 S.uid=session.user.id;
 $('#wa').href='https://wa.me/?text='+encodeURIComponent('Sumate a Pateando: gente en línea para caminar por tu zona. Chats de 15 minutos. '+location.origin+location.pathname);
 S.gp=gps();                 /* pide el GPS apenas te logueás */
 try{await loadP();next()}catch(e){toast('No se pudo cargar tu perfil');render('login')}}
let n=0;
setInterval(async()=>{if(document.hidden||!S.ready)return;
 if(view==='home'){n++;await refChats();drawBub();if(n%4===0){await refGente();drawLista()}}},4000);
setInterval(()=>{if(!document.hidden&&view==='chat')pollChat()},2000);
setInterval(async()=>{if(!document.hidden&&S.ready){await gps();ping().catch(()=>{})}},60000);   /* sigo "en línea" */
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ready){ping().catch(()=>{});if(view==='home')goHome()}});
boot();
</script>
</body>
</html>
