<style>
:root{--c:#38BDF8;--c2:#0EA5E9;--c3:#0369A1;--bg:#F0F9FF;--line:#BAE6FD;--ink:#0B2A3C;--mut:#4B6B80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E0F2FE;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 40px)}
.screen.tabbed{padding-bottom:calc(env(safe-area-inset-bottom) + 104px)}
h1{margin:0;font-size:28px;font-weight:800;line-height:1.15} h2{margin:0 0 12px;font-size:18px;font-weight:800}
p{margin:0;line-height:1.5} a{color:var(--c3)} .mut{color:var(--mut);font-size:13px} .col{display:flex;flex-direction:column;gap:20px} .g12{display:flex;flex-direction:column;gap:12px} .row{display:flex;align-items:center;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--c);color:var(--ink);font:800 16px Inter,sans-serif;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)} .btn.sec{background:#fff;border:1px solid var(--c3)} .btn:disabled{background:#E0F2FE;color:var(--mut);cursor:default;transform:none}
.link{background:none;border:0;padding:8px 0;font:600 14px Inter,sans-serif;color:var(--c3);cursor:pointer;text-align:left}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;background:var(--c2);border-radius:7px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.s{height:12px} .bar.s i{background:var(--c)}
.gift{flex:none;width:48px;height:48px;border-radius:24px;background:var(--c);display:flex;align-items:center;justify-content:center}
.gift.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.rise{opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;flex-wrap:wrap} .dots span{width:16px;height:16px;border-radius:8px;border:2px solid var(--c2)} .dots span.on{background:var(--c2)}
.av{width:40px;height:40px;border-radius:20px;background:var(--c);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.free{border:2px dashed var(--c2);background:none}
.chip{display:inline-block;background:var(--c);font-size:13px;font-weight:800;border-radius:12px;padding:6px 10px}
.back{background:none;border:0;font:600 15px Inter,sans-serif;color:var(--c3);padding:8px 0;cursor:pointer;margin-bottom:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800}
input[type=text],input[type=date],input[type=time],input[type=number],textarea{min-height:48px;width:100%;border:1px solid var(--c3);border-radius:12px;padding:0 12px;font:400 16px Inter,sans-serif;color:var(--ink);background:#fff}
textarea{padding:12px;resize:none}
select{min-height:48px;width:100%;border:1px solid var(--c3);border-radius:12px;padding:0 12px;font:400 16px Inter,sans-serif;background:#fff;color:var(--ink)} .btn.sm{min-height:40px;font-size:14px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;text-align:left} .chk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--c3)}
.star{width:48px;height:48px;border:0;background:none;padding:0;cursor:pointer;transition:transform .15s} .star:active{transform:scale(.85)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .kpi b{display:block;font-size:30px;font-weight:800;margin-top:4px}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px} .cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px}
.cols i{display:block;width:100%;height:0;background:var(--c);border-radius:6px 6px 0 0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
#tabs{position:absolute;left:0;right:0;bottom:0;display:none;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
#tabs button{flex:1;min-height:48px;border:0;background:none;font:600 14px Inter,sans-serif;color:var(--mut);cursor:pointer;position:relative}
#tabs button.on{color:var(--c3);font-weight:800} #tabs button.on::after{content:"";position:absolute;left:30%;right:30%;top:-6px;height:3px;border-radius:2px;background:var(--c2)}
#toast{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;transform:translateY(30px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);z-index:9}
#toast.on{transform:none;opacity:1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dt=(iso,o)=>new Date(iso).toLocaleString('es-AR',{timeZone:TZ,...o});
const fecha=iso=>cap(dt(iso,{weekday:'long',day:'numeric',month:'long'}));
const hora=iso=>dt(iso,{hour:'2-digit',minute:'2-digit',hour12:false});
const dur=m=>((m>=60?Math.floor(m/60)+' h ':'')+(m%60?m%60+' min':'')).trim();
const DAYN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const hoyAR=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const lunes=()=>{const d=new Date(hoyAR()+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toLocaleDateString('en-CA')};
const dl=d=>d===hoyAR()?'Hoy':DAYN[new Date(d+'T12:00:00').getDay()];
const q=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const dots=(n,c)=>`<div class="dots">${Array.from({length:c},(_,i)=>`<span class="${i<n?'on':''}"></span>`).join('')}</div><p class="mut" style="margin-top:8px">${n} de ${c} lugares ocupados. Si se llena, aplicás a la del finde siguiente.</p>`;
const rev=r=>`<div style="border-top:1px solid #E0F2FE;padding-top:12px"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${esc(r.nombre)} ${esc(r.apellido_inicial)}</b>${stars(r.estrellas)}</div><p style="font-size:14px;margin-top:4px">${esc(r.comentario)}</p></div>`;
let S={},cur=null,RATE=0,idx=0,WID=null,nav=0;

/* ============ DATOS (Supabase) ============ */
async function load(){
 const uid=S.uid;
 S.p=await q(sb.from('profiles').select('*').eq('id',uid).single());
 if(!S.p.acepto_terminos_at&&localStorage.getItem('consent')==='1'){
  const t=new Date().toISOString();await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:t}).eq('id',uid));
  S.p.mayor_de_18=true;S.p.acepto_terminos_at=t;localStorage.removeItem('consent')}
 S.admin=await q(sb.rpc('is_admin'));
 const [w]=await q(sb.from('walks').select('*').eq('estado','publicada').gte('inicia_at',new Date().toISOString()).order('inicia_at').limit(1));
 S.w=w||null;S.ok=[];S.yo=false;S.ocu=0;
 if(w){
  const [st,mine]=await Promise.all([q(sb.from('walk_stats').select('*').eq('walk_id',w.id).maybeSingle()),q(sb.from('walk_signups').select('estado').eq('walk_id',w.id).eq('user_id',uid).maybeSingle())]);
  S.ocu=st?st.ocupados:0;S.yo=!!mine&&mine.estado!=='cancelado';
  if(S.yo)S.ok=await q(sb.rpc('asistentes_caminata',{p_walk:w.id}));
 }
 const logs=await q(sb.from('step_logs').select('dia,pasos').gte('dia',lunes()));
 const by={};logs.forEach(l=>by[l.dia]=(by[l.dia]||0)+l.pasos);
 S.dias=Object.keys(by).sort().map(d=>[d,by[d]]);S.pasos=S.dias.reduce((a,b)=>a+b[1],0);
 const pw=await q(sb.from('walks').select('*').eq('estado','finalizada').order('inicia_at',{ascending:false}).limit(10));
 const ids=pw.map(x=>x.id);S.past=[];
 if(ids.length){
  const [st,rv,asi,mr]=await Promise.all([q(sb.from('walk_stats').select('*').in('walk_id',ids)),q(sb.from('reviews_public').select('*').in('walk_id',ids).order('created_at',{ascending:false})),q(sb.from('walk_signups').select('walk_id').eq('user_id',uid).eq('estado','asistio')),q(sb.from('reviews').select('walk_id').eq('user_id',uid))]);
  S.past=pw.map(w=>{const s=st.find(x=>x.walk_id===w.id)||{};return{w,n:s.asistentes||0,prom:s.promedio,rev:rv.filter(r=>r.walk_id===w.id),can:asi.some(a=>a.walk_id===w.id)&&!mr.some(m=>m.walk_id===w.id)}})}
}
const PRE={admin:async()=>{
 if(idx===0)S.res=await q(sb.rpc('admin_resumen'));
 if(idx===2){S.aw=await q(sb.from('walks').select('id,titulo,inicia_at,estado').order('inicia_at',{ascending:false}).limit(30));
  if(!WID||!S.aw.some(x=>x.id===WID))WID=S.aw[0]?S.aw[0].id:null;S.sg=[];S.rv=[];
  if(WID){[S.sg,S.rv]=await Promise.all([q(sb.from('walk_signups').select('user_id,estado,profiles(nombre,apellido,email)').eq('walk_id',WID)),q(sb.from('reviews').select('estrellas,comentario,profiles(nombre,apellido)').eq('walk_id',WID))])}}}};

/* ============ VISTAS ============ */
const gate=(act,label)=>`<div class="col" style="min-height:100%;text-align:center;align-items:center;padding-top:40px">
<div class="rise" style="display:flex;flex-direction:column;align-items:center;gap:12px">${logo}<span style="font-size:22px;font-weight:800;letter-spacing:.5px">Paseando</span></div>
<h1 class="rise" style="font-size:34px">Caminá solo,<br>para caminar en grupo.</h1>
<p class="rise mut" style="font-size:16px">Sumá pasos durante la semana y desbloqueá la caminata del fin de semana en los Bosques de Palermo. Infusiones y algo dulce incluidos.</p>
<div class="g12 rise" style="width:100%;margin-top:auto"><label class="chk"><input type="checkbox" id="ok18"><span>Tengo 18 años o más y acepto los <a href="#" data-go="terms">Términos y el descargo de responsabilidad</a>.</span></label>
<button class="btn" id="google" disabled data-act="${act}">${label}</button></div></div>`;
const V={
setup:()=>`<div class="col" style="padding-top:40px"><div class="card g12"><h2 style="margin:0">Falta configurar Supabase</h2><p style="font-size:14px">Completá <b>SUPABASE_URL</b> y <b>SUPABASE_ANON_KEY</b> al inicio del script de index.html (Project Settings → API en Supabase).</p></div></div>`,
login:()=>gate('login','Continuar con Google'),
consent:()=>gate('accept','Aceptar y continuar'),
home:()=>{const w=S.w,u=w&&S.pasos>=w.meta_pasos,pc=w?Math.min(100,S.pasos/w.meta_pasos*100):0,mx=Math.max(1,...S.dias.map(d=>d[1]));
const btn=!u?'<button class="btn" disabled>Bloqueada hasta llegar a la meta</button>':S.yo?'<button class="btn" data-go="walk">Ver mi caminata</button>':'<button class="btn" data-act="join">Anotarme a la caminata</button>';
const card=!w?'<div class="card rise"><h2 style="margin:0 0 6px">Próxima caminata</h2><p class="mut">Todavía no hay una caminata publicada. Volvé pronto.</p></div>':`<div class="card g12 rise"><div><p class="mut">Próxima caminata</p><p style="font-size:20px;font-weight:800;margin-top:2px">${fecha(w.inicia_at)}, ${hora(w.inicia_at)}</p><p style="font-size:14px;margin-top:4px">${esc(w.lugar)}${w.punto_encuentro?' · '+esc(w.punto_encuentro):''}</p></div>
<p style="font-size:14px">${esc(w.titulo)}. ${esc(w.incluye||'')}</p>
<div class="row"><div class="bar"><i data-w="${pc}"></i></div><div class="gift ${u?'pop':''}">${giftSvg}</div></div>
<p style="font-size:14px;font-weight:600;color:var(--c3)">${u?'¡Meta cumplida! Ya podés anotarte.':`Te faltan ${fmt(w.meta_pasos-S.pasos)} de ${fmt(w.meta_pasos)} pasos para desbloquearla`}</p>
<div>${dots(S.ocu,w.cupo_max)}</div>${btn}${w.sponsor?`<p class="mut" style="text-align:center">Con el apoyo de ${esc(w.sponsor)}</p>`:''}</div>`;
return `<div class="col"><div class="rise"><p class="mut">Hola, ${esc(S.p.nombre)}</p><h1 style="font-size:36px"><span data-count="${S.pasos}">0</span> <span class="mut" style="font-size:15px;font-weight:600">pasos esta semana</span></h1></div>${card}
<div class="rise"><h2>Día a día</h2><div class="g12">${S.dias.length?S.dias.map(([d,s])=>`<div class="row"><span style="width:36px;font-size:14px;color:var(--mut);font-weight:${d===hoyAR()?800:600}">${dl(d)}</span><div class="bar s"><i data-w="${s/mx*100}"></i></div><span style="width:56px;text-align:right;font-size:14px">${fmt(s)}</span></div>`).join(''):'<p class="mut">Todavía no hay pasos registrados esta semana.</p>'}</div></div>
<div><h2 class="rise">Caminatas anteriores</h2><div class="g12">${S.past.length?S.past.map((p,i)=>`<div class="card g12 rise"><div><p style="font-size:16px;font-weight:800">${fecha(p.w.inicia_at)}</p><p class="mut" style="margin-top:2px">${esc(p.w.lugar)} · ${p.n} asistentes${p.prom!=null?' · '+fmt(p.prom,1)+' de 5':''}</p></div>${p.rev.map(rev).join('')}${p.can?`<button class="btn" data-go="rate" data-arg="${i}">Calificar esta caminata</button>`:''}</div>`).join(''):'<p class="mut">Todavía no hubo caminatas.</p>'}</div></div>
<div class="row" style="justify-content:space-between;flex-wrap:wrap"><button class="link" data-go="terms">Términos</button>${S.admin?'<button class="link" data-go="admin" data-arg="0">Panel admin</button>':''}<button class="link" data-act="logout">Cerrar sesión</button></div></div>`},
walk:()=>{const w=S.w,yo=S.p.nombre+' '+(S.p.apellido[0]||'')+'.';
return `<div class="col"><div><button class="back" data-go="home">← Volver</button><span class="chip rise">Desbloqueada</span><h1 class="rise" style="margin-top:10px">${esc(w.titulo)}</h1></div>
<div class="card g12 rise">${[['Cuándo',`${fecha(w.inicia_at)}, ${hora(w.inicia_at)}`],['Dónde',esc(w.lugar)+(w.punto_encuentro?' · '+esc(w.punto_encuentro):'')],['Duración',`${dur(w.duracion_min)}. ${esc(w.incluye||'')}`],['Después','Podés quedarte con el grupo. El anfitrión se va.']].map(r=>`<div><p class="mut">${r[0]}</p><p style="font-weight:600">${r[1]}</p></div>`).join('')}</div>
<div class="card rise"><h2>Qué llevar</h2><ul style="margin:0;padding-left:20px;line-height:1.7">${(w.que_llevar||'').split(',').filter(x=>x.trim()).map(x=>`<li>${esc(x.trim())}</li>`).join('')}</ul></div>
<div class="card g12"><h2 style="margin:0">Quiénes van (${S.ok.length} de ${w.cupo_max})</h2>${S.ok.map(a=>{const n=esc(a.nombre)+' '+esc(a.apellido_inicial);return `<div class="row rise"><div class="av">${esc(a.nombre[0]||'?')}</div><b>${n}${n===esc(yo)?' (vos)':''}</b></div>`}).join('')}${Array.from({length:Math.max(0,w.cupo_max-S.ok.length)},()=>'<div class="row rise"><div class="av free"></div><span class="mut" style="font-size:16px">Lugar libre</span></div>').join('')}</div>
${w.sponsor?`<p class="mut rise" style="text-align:center">Con el apoyo de ${esc(w.sponsor)}</p>`:''}</div>`},
rate:()=>{const p=S.past[idx];return `<div class="col"><div><button class="back" data-go="home">← Volver</button><p class="mut">${fecha(p.w.inicia_at)} · ${esc(p.w.lugar)}</p><h1 style="margin-top:4px">¿Cómo estuvo la caminata?</h1></div>
<div class="card g12 rise"><b style="font-size:14px">Tu calificación</b><div class="row" style="gap:4px" id="stars">${[1,2,3,4,5].map(i=>`<button class="star" data-star="${i}" aria-label="${i} estrellas"><svg width="44" height="44" viewBox="0 0 24 24"><path d="${star}" fill="none" stroke="#0369A1" stroke-width="1.5"/></svg></button>`).join('')}</div>
<label class="f" for="cm">Contanos qué te pareció</label><textarea id="cm" maxlength="100" rows="3"></textarea><p class="mut" style="text-align:right" id="cnt">0/100</p></div>
<p class="mut rise">Tu reseña se publica como <b style="color:var(--ink)">${esc(S.p.nombre)} ${esc(S.p.apellido[0]||'')}.</b> (nombre y la inicial de tu apellido).</p>
<button class="btn rise" id="pub" disabled data-act="publish">Publicar reseña</button></div>`},
terms:()=>`<div class="col"><div><button class="back" data-go="${cur&&['login','consent'].includes(cur.name)?cur.name:'home'}">← Volver</button><h1>Términos y descargo</h1></div>
<div class="card rise mut" style="background:#E0F2FE;border:0;padding:12px;font-size:13px">Borrador de ejemplo: revisalo con un abogado antes de publicarlo.</div>
${[['Edad','Solo pueden participar personas de 18 años o más. Podemos pedir verificación de identidad.'],['Participación voluntaria','Caminar al aire libre implica riesgos (terreno, clima, caídas). Participás bajo tu propia responsabilidad y declarás estar en condiciones físicas de hacerlo.'],['Descargo de responsabilidad','El organizador no responde por lesiones, accidentes ni pérdida de objetos, en la medida en que la ley lo permita.'],['Conducta','Se espera respeto hacia el resto. Podemos retirar a quien no lo cumpla, sin devolución.'],['Datos personales','Usamos tu nombre y mail de Google. Quienes están anotados ven tu nombre y la inicial de tu apellido, y lo mismo en las reseñas. Tus datos se tratan según la Ley 25.326 y podés pedir su baja.'],['Fotos','Podemos sacar fotos del grupo. Avisanos si no querés aparecer.'],['Cupos','Cada caminata tiene un cupo máximo. Si se llena, aplicás a la del finde siguiente.']].map(t=>`<div class="rise"><h2 style="margin-bottom:4px;font-size:16px">${t[0]}</h2><p style="font-size:14px;color:#2B4A5E">${t[1]}</p></div>`).join('')}</div>`,
admin:()=>{const t=idx;let b='';
if(t==0){const R=S.res||{},ad=R.activos_por_dia||[],ph=R.pasos_por_hora||[],mx=Math.max(1,...ad.map(d=>d.usuarios));
 const fr=[['6–10',6,10],['10–14',10,14],['14–19',14,19],['19–23',19,23]].map(([l,a,z])=>[l,ph.filter(x=>x.hora>=a&&x.hora<z).reduce((s,x)=>s+x.pasos,0)]),tot=Math.max(1,ph.reduce((s,x)=>s+x.pasos,0));
 b=`<h1 class="rise">Resumen</h1><div class="grid2">${[['Usuarios',R.usuarios,0],['Activos esta semana',R.activos_semana,0],['Caminatas realizadas',R.caminatas,0],['Calificación promedio',R.calificacion,1]].map(k=>`<div class="card kpi rise"><span class="mut">${k[0]}</span>${k[1]==null?'<b>–</b>':`<b data-count="${k[1]}" data-dec="${k[2]}">0</b>`}</div>`).join('')}</div>
<div class="card rise"><h2>Usuarios activos por día</h2>${ad.length?`<div class="cols">${ad.map(d=>`<div>${d.usuarios}<i data-h="${d.usuarios/mx*100}"></i><span class="mut">${dl(d.dia)}</span></div>`).join('')}</div>`:'<p class="mut">Sin datos todavía.</p>'}</div>
<div class="card rise"><h2>Cuándo caminan</h2>${ph.length?`<div class="cols">${fr.map(d=>`<div>${Math.round(d[1]/tot*100)}%<i data-h="${d[1]/tot*100}"></i><span class="mut">${d[0]}</span></div>`).join('')}</div>`:'<p class="mut">Sin datos todavía.</p>'}</div>
<button class="btn sec rise" data-act="csvres">Exportar reporte para sponsors</button><p class="mut">Solo cifras agregadas, sin nombres ni mails.</p>`}
if(t==1)b=`<h1 class="rise">Crear caminata</h1><div class="card g12 rise"><label class="f">Nombre<input type="text" id="a1" placeholder="Vuelta al lago con picnic"></label><label class="f">Fecha<input type="date" id="a2"></label><label class="f">Hora<input type="time" id="a3"></label><label class="f">Lugar<input type="text" id="a4" value="Bosques de Palermo"></label><label class="f">Punto de encuentro<input type="text" id="a5"></label><label class="f">Duración (minutos)<input type="number" id="a6" value="90" min="15"></label><label class="f">Cupo máximo<input type="number" id="a7" value="10" min="1"></label><label class="f">Meta de pasos de la semana<input type="number" id="a8" value="100000" min="0"></label><label class="f">Sponsor<input type="text" id="a9"></label></div><button class="btn rise" data-act="create">Publicar caminata</button><button class="btn sec rise" data-act="draft">Guardar borrador</button><p class="mut">Al publicar, aparece en el Home de la app y se abre la inscripción.</p>`;
if(t==2){const w=(S.aw||[]).find(x=>x.id===WID);
 b=`<h1 class="rise">Asistentes y reseñas</h1>${!w?'<p class="mut">Todavía no hay caminatas.</p>':`<label class="f rise">Caminata<select id="wsel">${S.aw.map(x=>`<option value="${x.id}" ${x.id===WID?'selected':''}>${fecha(x.inicia_at)} · ${esc(x.titulo)} (${x.estado})</option>`).join('')}</select></label>
<div class="card g12 rise"><h2 style="margin:0">Registro (${S.sg.length})</h2>${S.sg.length?S.sg.map(a=>`<div style="border-top:1px solid #E0F2FE;padding-top:10px" class="g12"><div><b style="font-size:14px">${esc(a.profiles.nombre)} ${esc(a.profiles.apellido)}</b><p class="mut">${esc(a.profiles.email)} · ${a.estado.replace('_',' ')}</p></div><div class="row"><button class="btn sm ${a.estado==='asistio'?'':'sec'}" data-act="att" data-u="${a.user_id}" data-v="asistio">Asistió</button><button class="btn sm ${a.estado==='no_asistio'?'':'sec'}" data-act="att" data-u="${a.user_id}" data-v="no_asistio">No asistió</button></div></div>`).join(''):'<p class="mut">Nadie se anotó todavía.</p>'}
<button class="btn sec" data-act="csv">Exportar CSV</button>${w.estado==='publicada'?'<button class="btn" data-act="fin">Marcar como finalizada</button>':''}</div>
${S.rv.map(r=>`<div class="card rise"><div class="row" style="justify-content:space-between"><b style="font-size:14px">${esc(r.profiles.nombre)} ${esc(r.profiles.apellido)}</b>${stars(r.estrellas)}</div><p style="font-size:14px;margin-top:4px">${esc(r.comentario)}</p></div>`).join('')}<p class="mut">Solo vos ves los datos completos.</p>`}`}
return `<div class="col"><button class="back" data-go="home" style="align-self:flex-start">← Salir del panel</button>${b}</div>`}
};

/* ============ ROUTER Y ANIMACIONES ============ */
function enhance(el){
 el.querySelectorAll('.rise').forEach((n,i)=>n.style.animationDelay=Math.min(i*70,700)+'ms');
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  el.querySelectorAll('[data-w]').forEach(n=>n.style.width=n.dataset.w+'%');
  el.querySelectorAll('[data-h]').forEach(n=>n.style.height=n.dataset.h+'%')}));
 el.querySelectorAll('[data-count]').forEach(n=>{const to=+n.dataset.count,d=+(n.dataset.dec||0),t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-k,3);n.textContent=fmt(to*e,d);if(k<1)requestAnimationFrame(f)})(t0)});
}
function tabs(on){const t=$('#tabs');if(on==null){t.style.display='none';return}t.style.display='flex';
 t.innerHTML=['Resumen','Crear','Asistentes'].map((n,i)=>`<button class="${i===on?'on':''}" data-go="admin" data-arg="${i}">${n}</button>`).join('')}
async function go(name,arg,back){
 const my=++nav;if(arg!=null)idx=+arg;
 if(PRE[name]){try{await PRE[name]()}catch(e){toast(e.message||'No se pudo cargar')}}
 if(my!==nav)return;
 const old=cur&&cur.el;
 const el=document.createElement('main');el.className='screen'+(name==='admin'?' tabbed':'');el.innerHTML=V[name]();
 $('#app').insertBefore(el,$('#tabs'));cur={name,el};tabs(name==='admin'?idx:null);RATE=0;enhance(el);
 const dir=back==='fade'?0:back?-28:28;
 el.animate([{transform:`translateX(${dir}px)`,opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});
 if(old){old.style.pointerEvents='none';old.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}).onfinish=()=>old.remove()}
 el.scrollTop=0}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}
const csv=(name,rows)=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));l.download=name;l.click()};

document.addEventListener('click',async e=>{
 const s=e.target.closest('[data-star]');
 if(s){RATE=+s.dataset.star;document.querySelectorAll('#stars .star').forEach((b,i)=>{const p=b.querySelector('path');p.setAttribute('fill',i<RATE?'#0EA5E9':'none');if(i<RATE)b.animate([{transform:'scale(.7)'},{transform:'scale(1)'}],{duration:300,delay:i*40,easing:'cubic-bezier(.3,1.6,.5,1)'})});chk();return}
 const t=e.target.closest('[data-go],[data-act]');if(!t||t.disabled)return;
 if(t.dataset.go){e.preventDefault();go(t.dataset.go,t.dataset.arg,['home','login','consent'].includes(t.dataset.go)&&cur.name!=='login'&&cur.name!=='consent');return}
 const a=t.dataset.act;
 try{
 if(a==='login'){localStorage.setItem('consent','1');await q(sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}))}
 if(a==='accept'){const ts=new Date().toISOString();await q(sb.from('profiles').update({mayor_de_18:true,acepto_terminos_at:ts}).eq('id',S.uid));S.p.acepto_terminos_at=ts;await load();go('home')}
 if(a==='logout'){await sb.auth.signOut();S={};go('login',null,true)}
 if(a==='join'){t.disabled=true;const r=await q(sb.rpc('join_walk',{p_walk:S.w.id}));await load();
  if(r==='completa'){toast('Se completó el cupo. Aplicás a la caminata del finde siguiente.');go('home',null,'fade')}else{toast('¡Listo! Te anotaste a la caminata');go('walk')}}
 if(a==='publish'){t.disabled=true;const p=S.past[idx];await q(sb.from('reviews').insert({walk_id:p.w.id,user_id:S.uid,estrellas:RATE,comentario:$('#cm').value.trim()}));await load();toast('¡Gracias por tu reseña!');go('home',null,true)}
 if(a==='create'||a==='draft'){const g=i=>$('#a'+i).value;if(!g(1)||!g(2)||!g(3)){toast('Completá nombre, fecha y hora');return}
  await q(sb.from('walks').insert({titulo:g(1),inicia_at:new Date(`${g(2)}T${g(3)}:00-03:00`).toISOString(),lugar:g(4)||'Bosques de Palermo',punto_encuentro:g(5)||null,duracion_min:+g(6),cupo_max:+g(7),meta_pasos:+g(8),sponsor:g(9)||null,estado:a==='create'?'publicada':'borrador'}));
  toast(a==='create'?'Caminata publicada: ya aparece en la app':'Borrador guardado')}
 if(a==='att'){await q(sb.from('walk_signups').update({estado:t.dataset.v}).eq('walk_id',WID).eq('user_id',t.dataset.u));go('admin',2,'fade')}
 if(a==='fin'){await q(sb.from('walks').update({estado:'finalizada'}).eq('id',WID));toast('Caminata finalizada');go('admin',2,'fade')}
 if(a==='csv')csv('asistentes.csv',['nombre,apellido,mail,estado',...S.sg.map(x=>[x.profiles.nombre,x.profiles.apellido,x.profiles.email,x.estado].join(','))]);
 if(a==='csvres'){const R=S.res||{};csv('resumen.csv',['metrica,valor',`usuarios,${R.usuarios}`,`activos_semana,${R.activos_semana}`,`pasos_semana,${R.pasos_semana}`,`caminatas,${R.caminatas}`,`calificacion,${R.calificacion??''}`])}
 }catch(err){toast(err.message||'Ocurrió un error');if(t)t.disabled=false}
});
document.addEventListener('input',e=>{
 if(e.target.id==='ok18')$('#google').disabled=!e.target.checked;
 if(e.target.id==='cm'){$('#cnt').textContent=e.target.value.length+'/100';chk()}});
document.addEventListener('change',e=>{if(e.target.id==='wsel'){WID=e.target.value;go('admin',2,'fade')}});
function chk(){const b=$('#pub');if(b)b.disabled=!(RATE>0&&$('#cm').value.trim().length>0)}

/* ============ INICIO ============ */
async function boot(){
 if(!sb){go('setup');return}
 const{data:{session}}=await sb.auth.getSession();
 if(!session){go('login');return}
 S.uid=session.user.id;
 try{await load();go(S.p.acepto_terminos_at?'home':'consent')}catch(e){toast(e.message||'No se pudo cargar');go('login')}
}
/* Para la app nativa (Capacitor/Flutter webview): después de leer Apple Health / Health Connect
   llamar Paseando.syncSteps([{dia:'2026-11-14',hora:9,pasos:1200}, ...]) */
window.Paseando={syncSteps:async rows=>{await q(sb.from('step_logs').upsert(rows.map(x=>({user_id:S.uid,dia:x.dia,hora:x.hora,pasos:x.pasos}))));if(cur&&cur.name==='home'){await load();go('home',null,'fade')}}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sb&&S.uid&&cur&&cur.name==='home')load().then(()=>go('home',null,'fade')).catch(()=>{})});
boot();
</script>
